<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>有声PDF阅读器 · 绘本版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; -webkit-user-select: none; user-select: none; }

        .app { display: flex; width: 100vw; height: 100vh; overflow: hidden; background: #f0f2f5; }

        /* ===== 左侧菜单栏 ===== */
        .sidebar { width: 260px; min-width: 260px; height: 100%; background: #ffffff; border-right: 1px solid #e4e7ec; display: flex; flex-direction: column; overflow: hidden; z-index: 10; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-header { padding: 14px 16px 10px; border-bottom: 1px solid #eef0f4; flex-shrink: 0; }
        .sidebar-header h2 { font-size: 16px; font-weight: 700; color: #0f172a; }
        .sidebar-header .sub { font-size: 10px; color: #94a3b8; margin-top: 1px; }
        .sidebar-actions { padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; border-bottom: 1px solid #eef0f4; }

        .btn-side { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 10px; border-radius: 8px; border: none; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; background: #f1f5f9; color: #1e293b; width: 100%; position: relative; }
        .btn-side:hover { background: #e2e8f0; }
        .btn-side:active { transform: scale(0.97); }
        .btn-side:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-side input[type="file"] { position: absolute; opacity: 0; width: 100%; height: 100%; top: 0; left: 0; cursor: pointer; }

        .sidebar-divider { border: none; border-top: 1px solid #eef0f4; margin: 4px 0; }

        .record-list { flex: 1; overflow-y: auto; padding: 6px 10px; -webkit-overflow-scrolling: touch; }
        .record-list::-webkit-scrollbar { width: 3px; }
        .record-list::-webkit-scrollbar-thumb { background: #d1d9e6; border-radius: 4px; }

        .record-item { padding: 10px 12px; border-radius: 10px; margin-bottom: 4px; cursor: pointer; transition: all 0.15s; background: transparent; border: 1px solid transparent; position: relative; display: flex; align-items: center; justify-content: space-between; }
        .record-item:hover { background: #f8fafc; }
        .record-item.active { background: #eff6ff; border-color: #bfdbfe; }
        .record-item .info { flex: 1; min-width: 0; cursor: pointer; }
        .record-item .name { font-weight: 600; font-size: 12px; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .record-item .meta { font-size: 10px; color: #94a3b8; margin-top: 1px; display: flex; gap: 8px; align-items: center; }
        .record-item .badge-pages { background: #e2e8f0; padding: 0 6px; border-radius: 8px; font-size: 9px; }
        .record-item .item-actions { display: flex; gap: 2px; flex-shrink: 0; }
        .record-item .item-actions button { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 12px; padding: 3px 5px; border-radius: 4px; transition: all 0.15s; }
        .record-item .item-actions button:hover { background: #eef2f6; color: #3b82f6; }
        .record-item .item-actions .delete-btn:hover { background: #fee2e2; color: #dc2626; }
        .record-item .item-actions .export-btn:hover { background: #dcfce7; color: #16a34a; }
        .record-empty { text-align: center; color: #94a3b8; padding: 24px 12px; font-size: 12px; }

        /* ===== 右侧主内容 ===== */
        .main-content { flex: 1; display: flex; height: 100%; overflow: hidden; background: #e8ecf1; position: relative; }
        .pdf-viewport { flex: 1; position: relative; overflow: hidden; background: #e8ecf1; touch-action: none; display: flex; align-items: center; justify-content: center; }
        .pdf-viewport .canvas-wrapper { position: relative; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: grab; width: 100%; height: 100%; }
        .pdf-viewport .canvas-wrapper:active { cursor: grabbing; }
        #pdfCanvas { display: none; background: white; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); touch-action: none; }
        .pdf-placeholder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #94a3b8; font-size: 15px; text-align: center; pointer-events: none; }
        .pdf-placeholder .big-icon { font-size: 36px; display: block; margin-bottom: 8px; }

        /* ===== 右侧工具栏 ===== */
        .right-toolbar { width: 260px; min-width: 260px; height: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-left: 1px solid rgba(226, 232, 240, 0.5); display: flex; flex-direction: column; padding: 12px 14px 16px; z-index: 15; flex-shrink: 0; overflow-y: auto; gap: 6px; }
        .right-toolbar::-webkit-scrollbar { width: 3px; }
        .right-toolbar::-webkit-scrollbar-thumb { background: #d1d9e6; border-radius: 4px; }

        .tool-section { background: #f8fafc; border-radius: 10px; padding: 10px 12px; border: 1px solid #eef0f4; }
        .tool-section .section-title { font-size: 9px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }

        .file-info .name { font-weight: 600; font-size: 13px; color: #0f172a; word-break: break-all; line-height: 1.3; }
        .file-info .detail { font-size: 11px; color: #94a3b8; }

        .nav-controls { display: flex; align-items: center; gap: 6px; }
        .nav-controls button { width: 32px; height: 32px; border-radius: 6px; border: 1px solid #e2e8f0; background: white; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #1e293b; transition: all 0.15s; }
        .nav-controls button:hover:not(:disabled) { background: #f1f5f9; border-color: #94a3b8; }
        .nav-controls button:disabled { opacity: 0.3; cursor: not-allowed; }
        .nav-controls .page-info { flex: 1; text-align: center; font-size: 13px; font-weight: 500; color: #0f172a; }
        .nav-controls .page-info .total { color: #94a3b8; font-weight: 400; }

        .zoom-controls { display: flex; align-items: center; gap: 4px; }
        .zoom-controls button { width: 28px; height: 28px; border-radius: 5px; border: 1px solid #e2e8f0; background: white; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #1e293b; transition: all 0.15s; }
        .zoom-controls button:hover { background: #f1f5f9; }
        .zoom-controls .zoom-level { flex: 1; text-align: center; font-size: 12px; color: #475569; font-weight: 500; }

        .audio-player { background: #f8fafc; border-radius: 10px; padding: 10px 12px; border: 1px solid #eef0f4; }
        .audio-player .audio-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
        .audio-player .audio-header .label { font-size: 9px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .audio-player .audio-header .status-text { font-size: 11px; color: #64748b; }

        .progress-container { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; }
        .progress-container .time { font-size: 10px; color: #94a3b8; font-variant-numeric: tabular-nums; min-width: 32px; }
        .progress-container .time.current { color: #0f172a; }
        .progress-bar { flex: 1; height: 3px; border-radius: 2px; background: #e2e8f0; cursor: pointer; position: relative; transition: height 0.15s; }
        .progress-bar:hover { height: 5px; }
        .progress-bar .progress-fill { height: 100%; border-radius: 2px; background: #3b82f6; width: 0%; transition: width 0.1s; position: relative; }

        .audio-controls-row { display: flex; align-items: center; gap: 5px; }
        .audio-controls-row button { width: 30px; height: 30px; border-radius: 50%; border: none; background: #f1f5f9; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; color: #1e293b; transition: all 0.15s; }
        .audio-controls-row button:hover { background: #e2e8f0; }
        .audio-controls-row button.playing { background: #3b82f6; color: white; }
        .audio-controls-row button.playing:hover { background: #2563eb; }
        .audio-controls-row .audio-name { flex: 1; font-size: 11px; color: #475569; margin-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 音频列表 - 全部展开，无滚动 */
        .audio-list-section { background: #f8fafc; border-radius: 10px; padding: 10px 12px; border: 1px solid #eef0f4; flex-shrink: 0; }
        .audio-list-section .section-title { font-size: 9px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .audio-list-section .section-title .count { font-weight: 400; font-size: 9px; }
        .audio-list-item { display: flex; align-items: center; gap: 6px; padding: 3px 5px; border-radius: 5px; cursor: pointer; transition: all 0.15s; font-size: 11px; color: #475569; }
        .audio-list-item:hover { background: #eef2f6; }
        .audio-list-item.active { background: #eff6ff; color: #1e293b; }
        .audio-list-item .page-tag { background: #e2e8f0; padding: 0 5px; border-radius: 3px; font-size: 8px; font-weight: 600; color: #64748b; flex-shrink: 0; }
        .audio-list-item .audio-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .audio-list-item .audio-status-icon { font-size: 10px; flex-shrink: 0; }
        .audio-list-item .replace-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 10px; padding: 2px 3px; border-radius: 3px; transition: all 0.15s; flex-shrink: 0; }
        .audio-list-item .replace-btn:hover { background: #e2e8f0; color: #3b82f6; }
        .audio-list-empty { font-size: 11px; color: #94a3b8; text-align: center; padding: 6px 0; }

        /* ===== 提示弹窗 ===== */
        .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999; padding: 24px 36px; border-radius: 16px; font-size: 16px; font-weight: 600; box-shadow: 0 20px 60px rgba(0,0,0,0.3); min-width: 280px; text-align: center; animation: toastIn 0.3s ease-out; pointer-events: none; }
        .toast.success { background: #dcfce7; color: #166534; border: 2px solid #86efac; }
        .toast.error { background: #fee2e2; color: #991b1b; border: 2px solid #fca5a5; }
        .toast.info { background: #dbeafe; color: #1e40af; border: 2px solid #93c5fd; }
        .toast .toast-sub { font-size: 13px; font-weight: 400; margin-top: 6px; opacity: 0.8; }
        .toast .toast-close { position: absolute; top: 8px; right: 12px; background: none; border: none; font-size: 18px; cursor: pointer; color: inherit; opacity: 0.5; pointer-events: auto; }
        .toast .toast-close:hover { opacity: 1; }
        @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        .toast-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.2); z-index: 9998; pointer-events: auto; }

        /* ===== 移动端 ===== */
        @media (max-width: 1024px) { .right-toolbar { width: 200px; min-width: 200px; padding: 10px; } }
        @media (max-width: 768px) {
            .sidebar { position: fixed; top: 0; left: 0; width: 280px; height: 100%; transform: translateX(-100%); box-shadow: 4px 0 20px rgba(0,0,0,0.15); border-right: none; z-index: 100; }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 99; }
            .sidebar-overlay.active { display: block; }
            #toggleSidebarBtn { display: flex !important; }
            .right-toolbar { width: 180px; min-width: 180px; padding: 8px; }
            .toast { min-width: 200px; padding: 16px 24px; font-size: 14px; }
        }
        #toggleSidebarBtn { display: none; background: transparent; border: none; font-size: 17px; cursor: pointer; padding: 4px 6px; color: #1e293b; border-radius: 6px; align-items: center; justify-content: center; }
        #toggleSidebarBtn:hover { background: #f1f5f9; }

        .hidden-input { display: none; }
    </style>
</head>
<body>

<div class="app" id="app">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ===== 左侧菜单 ===== -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>有声书库</h2>
            <div class="sub">本地存储 · 导出ZIP · 导入ZIP</div>
        </div>
        <div class="sidebar-actions">
            <button class="btn-side" id="importPdfBtn">
                导入PDF
                <input type="file" id="pdfFileInput" accept=".pdf">
            </button>
            <button class="btn-side" id="importAudioBtn">
                批量添加音频
                <input type="file" id="audioFileInput" accept=".mp3,.wav,.aac,.ogg,.m4a" multiple>
            </button>
            <hr class="sidebar-divider">
            <button class="btn-side" id="exportAllBtn">
                导出全部ZIP
            </button>
            <button class="btn-side" id="importZipBtn">
                导入ZIP
                <input type="file" id="zipFileInput" accept=".zip">
            </button>
            <hr class="sidebar-divider">
            <button class="btn-side danger" id="clearAllBtn">
                清空所有记录
            </button>
        </div>
        <div class="record-list" id="recordList">
            <div class="record-empty">暂无阅读记录<br><span style="font-size:10px;">导入PDF后自动保存</span></div>
        </div>
    </div>

    <!-- ===== 右侧主内容 ===== -->
    <div class="main-content">
        <div class="pdf-viewport" id="pdfViewport">
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="pdfCanvas"></canvas>
            </div>
            <div class="pdf-placeholder" id="pdfPlaceholder">
                <span class="big-icon">📖</span>
                请从左侧菜单导入PDF
            </div>
        </div>

        <!-- 右侧工具栏 -->
        <div class="right-toolbar" id="rightToolbar">
            <button id="toggleSidebarBtn">☰</button>

            <div class="tool-section">
                <div class="file-info">
                    <div class="name" id="fileNameDisplay">未选择PDF</div>
                    <div class="detail" id="fileDetailDisplay">请导入PDF文件</div>
                </div>
            </div>

            <div class="tool-section">
                <div class="section-title">翻页</div>
                <div class="nav-controls">
                    <button id="prevPageBtn" disabled>◀</button>
                    <span class="page-info" id="pageInfoDisplay">0 <span class="total">/ 0</span></span>
                    <button id="nextPageBtn" disabled>▶</button>
                </div>
            </div>

            <div class="tool-section">
                <div class="section-title">缩放</div>
                <div class="zoom-controls">
                    <button id="zoomOutBtn">−</button>
                    <span class="zoom-level" id="zoomLevelDisplay">100%</span>
                    <button id="zoomInBtn">+</button>
                    <button id="zoomResetBtn" style="font-size:13px;width:28px;">⟲</button>
                </div>
            </div>

            <div class="audio-player" id="audioPlayer">
                <div class="audio-header">
                    <span class="label">播放器</span>
                    <span class="status-text" id="audioStatusText">就绪</span>
                </div>
                <div class="progress-container">
                    <span class="time current" id="currentTimeDisplay">0:00</span>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="time" id="durationDisplay">0:00</span>
                </div>
                <div class="audio-controls-row">
                    <button id="playBtn">▶</button>
                    <button id="stopBtn">⏹</button>
                    <span class="audio-name" id="currentAudioName">无音频</span>
                </div>
            </div>

            <!-- 音频列表 - 全部展开 -->
            <div class="audio-list-section" id="audioListSection">
                <div class="section-title">
                    音频列表
                    <span class="count" id="audioCountDisplay">0 个</span>
                </div>
                <div id="audioListContainer">
                    <div class="audio-list-empty">暂无音频，请批量添加</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 隐藏文件输入 -->
<input type="file" id="replaceAudioInput" accept=".mp3,.wav,.aac,.ogg,.m4a" class="hidden-input">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
    'use strict';

    const STORAGE_KEY = 'audioPdfRecords';
    const DB_NAME = 'AudioPdfDB';
    const STORE_NAME = 'pdfFiles';
    const AUDIO_STORE_NAME = 'audioFiles';

    const PDFJS = window.pdfjsLib;
    PDFJS.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let db = null;
    let records = [];
    let currentRecordId = null;
    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    let pageAudioMap = new Map();
    let audioElements = {};
    let currentAudio = null;
    let isPlaying = false;
    let zoomLevel = 1.0;
    let baseScale = 1.0;
    let panX = 0, panY = 0;
    let isLoading = false;
    let replaceTargetPage = null;

    // DOM
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const viewport = document.getElementById('pdfViewport');
    const placeholder = document.getElementById('pdfPlaceholder');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const fileDetailDisplay = document.getElementById('fileDetailDisplay');
    const pageInfoDisplay = document.getElementById('pageInfoDisplay');
    const zoomLevelDisplay = document.getElementById('zoomLevelDisplay');
    const recordListEl = document.getElementById('recordList');
    const audioStatusText = document.getElementById('audioStatusText');
    const currentAudioName = document.getElementById('currentAudioName');
    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const durationDisplay = document.getElementById('durationDisplay');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const audioListContainer = document.getElementById('audioListContainer');
    const audioCountDisplay = document.getElementById('audioCountDisplay');

    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const pdfFileInput = document.getElementById('pdfFileInput');
    const audioFileInput = document.getElementById('audioFileInput');
    const replaceAudioInput = document.getElementById('replaceAudioInput');
    const zipFileInput = document.getElementById('zipFileInput');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomResetBtn = document.getElementById('zoomResetBtn');
    const exportAllBtn = document.getElementById('exportAllBtn');
    const importZipBtn = document.getElementById('importZipBtn');

    // ============================================================
    //  Toast 提示
    // ============================================================
    function showToast(message, type, subMessage) {
        const overlay = document.createElement('div');
        overlay.className = 'toast-overlay';
        overlay.id = 'toastOverlay';
        document.body.appendChild(overlay);

        const toast = document.createElement('div');
        toast.className = 'toast ' + type;
        toast.id = 'toastMessage';
        toast.innerHTML = `
            <button class="toast-close" onclick="document.getElementById('toastMessage').remove();document.getElementById('toastOverlay').remove();">✕</button>
            <div>${message}</div>
            ${subMessage ? `<div class="toast-sub">${subMessage}</div>` : ''}
        `;
        document.body.appendChild(toast);

        overlay.addEventListener('click', function() {
            toast.remove();
            overlay.remove();
        });

        setTimeout(() => {
            if (document.getElementById('toastMessage')) {
                toast.remove();
                overlay.remove();
            }
        }, 4000);
    }

    // ============================================================
    //  IndexedDB
    // ============================================================
    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 2);
            request.onupgradeneeded = function(e) {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                }
                if (!db.objectStoreNames.contains(AUDIO_STORE_NAME)) {
                    db.createObjectStore(AUDIO_STORE_NAME, { keyPath: 'id' });
                }
            };
            request.onsuccess = function(e) { db = e.target.result; resolve(db); };
            request.onerror = function(e) { reject(e.target.error); };
        });
    }

    function savePDFToDB(id, data) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction([STORE_NAME], 'readwrite');
            tx.objectStore(STORE_NAME).put({ id, data }).onsuccess = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    function getPDFFromDB(id) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction([STORE_NAME], 'readonly');
            const req = tx.objectStore(STORE_NAME).get(id);
            req.onsuccess = () => resolve(req.result ? req.result.data : null);
            req.onerror = () => reject(req.error);
        });
    }

    function deletePDFFromDB(id) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction([STORE_NAME], 'readwrite');
            tx.objectStore(STORE_NAME).delete(id).onsuccess = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    function saveAudioToDB(id, data, name) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction([AUDIO_STORE_NAME], 'readwrite');
            tx.objectStore(AUDIO_STORE_NAME).put({ id, data, name }).onsuccess = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    function getAudioFromDB(id) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction([AUDIO_STORE_NAME], 'readonly');
            const req = tx.objectStore(AUDIO_STORE_NAME).get(id);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => reject(req.error);
        });
    }

    function deleteAudioFromDB(id) {
        return new Promise((resolve, reject) => {
            const tx = db.transaction([AUDIO_STORE_NAME], 'readwrite');
            tx.objectStore(AUDIO_STORE_NAME).delete(id).onsuccess = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    function getAllAudioFromDB() {
        return new Promise((resolve, reject) => {
            const tx = db.transaction([AUDIO_STORE_NAME], 'readonly');
            const req = tx.objectStore(AUDIO_STORE_NAME).getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => reject(req.error);
        });
    }

    function clearAllAudioFromDB() {
        return new Promise((resolve, reject) => {
            const tx = db.transaction([AUDIO_STORE_NAME], 'readwrite');
            tx.objectStore(AUDIO_STORE_NAME).clear().onsuccess = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    // ============================================================
    //  存储
    // ============================================================
    function loadRecords() {
        try {
            const data = localStorage.getItem(STORAGE_KEY);
            records = data ? JSON.parse(data) : [];
        } catch(e) { records = []; }
        if (!Array.isArray(records)) records = [];
    }

    function saveRecords() {
        try {
            const saveData = records.map(r => {
                const clean = { ...r };
                if (clean.audioMap) {
                    const newMap = {};
                    for (const [k, v] of Object.entries(clean.audioMap)) {
                        newMap[k] = { name: v.name, audioId: v.audioId };
                    }
                    clean.audioMap = newMap;
                }
                delete clean.pdfData;
                return clean;
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
        } catch(e) { console.warn('保存失败', e); }
    }

    // ============================================================
    //  导出全部ZIP
    // ============================================================
    async function exportAllData() {
        const zip = new JSZip();
        const folder = zip.folder('library');

        folder.file('records.json', JSON.stringify(records, null, 2));

        for (const rec of records) {
            try {
                const data = await getPDFFromDB(rec.id);
                if (data) {
                    folder.file('pdfs/' + rec.id + '.pdf', data);
                }
            } catch(e) { console.warn('导出PDF失败:', rec.id, e); }
        }

        const allAudio = await getAllAudioFromDB();
        const audioNames = {};
        for (const audio of allAudio) {
            folder.file('audios/' + audio.id + '.bin', audio.data);
            audioNames[audio.id] = audio.name;
        }
        folder.file('audio_names.json', JSON.stringify(audioNames));

        const zipBlob = await zip.generateAsync({ type: 'blob' });
        return zipBlob;
    }

    // ============================================================
    //  导入ZIP
    // ============================================================
    async function importAllData(zipBlob) {
        const zip = await JSZip.loadAsync(zipBlob);
        const folder = zip.folder('library');
        if (!folder) throw new Error('无效的ZIP文件：缺少library目录');

        const recordsFile = folder.file('records.json');
        if (!recordsFile) throw new Error('无效的ZIP文件：缺少records.json');
        const recordsText = await recordsFile.async('string');
        const importedRecords = JSON.parse(recordsText);

        let audioNames = {};
        const audioNamesFile = folder.file('audio_names.json');
        if (audioNamesFile) {
            audioNames = JSON.parse(await audioNamesFile.async('string'));
        }

        for (const rec of records) {
            if (rec.audioMap) {
                for (const [k, v] of Object.entries(rec.audioMap)) {
                    if (v.audioId) await deleteAudioFromDB(v.audioId);
                }
            }
            await deletePDFFromDB(rec.id);
        }
        await clearAllAudioFromDB();
        records = [];

        const pdfFolder = folder.folder('pdfs');
        for (const rec of importedRecords) {
            const pdfFile = pdfFolder.file(rec.id + '.pdf');
            if (pdfFile) {
                const data = await pdfFile.async('arraybuffer');
                await savePDFToDB(rec.id, data);
            }
            if (rec.audioMap) {
                const newMap = {};
                for (const [k, v] of Object.entries(rec.audioMap)) {
                    const audioId = v.audioId;
                    const audioFile = folder.file('audios/' + audioId + '.bin');
                    if (audioFile) {
                        const audioData = await audioFile.async('arraybuffer');
                        const name = audioNames[audioId] || v.name || '音频';
                        await saveAudioToDB(audioId, audioData, name);
                        newMap[k] = { name, audioId };
                    } else {
                        newMap[k] = { name: v.name, audioId: null };
                    }
                }
                rec.audioMap = newMap;
            }
            records.push(rec);
        }

        saveRecords();
        if (records.length > 0) {
            await loadRecord(records[0].id);
        }
        renderRecords();
        renderAudioList();
    }

    // ============================================================
    //  侧边栏
    // ============================================================
    function renderRecords() {
        if (records.length === 0) {
            recordListEl.innerHTML = `<div class="record-empty">暂无阅读记录<br><span style="font-size:10px;">导入PDF后自动保存</span></div>`;
            return;
        }
        let html = '';
        records.forEach((rec) => {
            const active = rec.id === currentRecordId ? 'active' : '';
            const pages = rec.pages || 0;
            const audioCount = rec.audioMap ? Object.keys(rec.audioMap).length : 0;
            html += `
                <div class="record-item ${active}" data-id="${rec.id}">
                    <div class="info" data-id="${rec.id}">
                        <div class="name">${rec.name || '未命名'}</div>
                        <div class="meta">
                            <span>${pages}页</span>
                            <span class="badge-pages">音频 ${audioCount}</span>
                        </div>
                    </div>
                    <div class="item-actions">
                        <button class="export-btn" data-id="${rec.id}" title="导出此绘本">📤</button>
                        <button class="delete-btn" data-id="${rec.id}" title="删除">✕</button>
                    </div>
                </div>
            `;
        });
        recordListEl.innerHTML = html;

        document.querySelectorAll('.record-item .info').forEach(el => {
            el.addEventListener('click', function() {
                const id = this.dataset.id;
                if (id) { loadRecord(id); closeSidebar(); }
            });
        });

        document.querySelectorAll('.record-item .delete-btn').forEach(el => {

                e.stopPropagation();
                const id = this.dataset.id;

    // ============================================================
    //  导出单个绘本
    // ============================================================
    async function exportSingleRecordForZip(record) {
        const zip = new JSZip();
        const folder = zip.folder(record.id);

        const recordData = { ...record };
        if (recordData.audioMap) {
            const cleanMap = {};
            for (const [k, v] of Object.entries(recordData.audioMap)) {
                cleanMap[k] = { name: v.name };
            }
            recordData.audioMap = cleanMap;
        }
        folder.file('record.json', JSON.stringify(recordData, null, 2));

        const pdfData = await getPDFFromDB(record.id);
        if (pdfData) {
            folder.file('document.pdf', pdfData);
        }

        if (record.audioMap) {
            const audioFolder = folder.folder('audios');
            for (const [pageIdx, audioInfo] of Object.entries(record.audioMap)) {
                if (audioInfo.audioId) {
                    try {
                        const audioData = await getAudioFromDB(audioInfo.audioId);
                        if (audioData && audioData.data) {
                            const ext = audioData.name ? audioData.name.split('.').pop() : 'mp3';
                            audioFolder.file(pageIdx + '.' + ext, audioData.data);
                        }
                    } catch(e) {
                        console.warn('导出音频失败:', e);
                    }
                }
            }
        }

        const zipBlob = await zip.generateAsync({ type: 'blob' });
        return zipBlob;
    }

    async function exportSingleRecord(recordId) {
        const rec = records.find(r => r.id === recordId);
        if (!rec) { showToast('记录不存在', 'error'); return; }

        try {
            const blob = await exportSingleRecordForZip(rec);
            const link = document.createElement('a');
            link.download = `${rec.name.replace(/\.pdf$/i, '')}_绘本.zip`;
            link.href = URL.createObjectURL(blob);
            link.click();
            URL.revokeObjectURL(link.href);
            showToast('导出成功: ' + rec.name, 'success', (blob.size / 1024 / 1024).toFixed(1) + ' MB');
        } catch(e) {
            console.error(e);
            showToast('导出失败: ' + rec.name, 'error', e.message);
        }
    }

    // ============================================================
    //  删除记录
    // ============================================================
    async function deleteRecord(id) {
        try {
            const rec = records.find(r => r.id === id);
            if (rec && rec.audioMap) {
                for (const [k, v] of Object.entries(rec.audioMap)) {
                    if (v.audioId) await deleteAudioFromDB(v.audioId);
                }
            }
            await deletePDFFromDB(id);
            records = records.filter(r => r.id !== id);
            if (currentRecordId === id) {
                currentRecordId = null;
                pdfDoc = null;
                totalPages = 0;
                currentPage = 1;
                pageAudioMap.clear();
                audioElements = {};
                placeholder.style.display = 'block';
                canvas.style.display = 'none';
                updateUI();
                audioStatusText.textContent = '就绪';
            }
            saveRecords();
            renderRecords();
            renderAudioList();
            showToast('已删除记录', 'info');
        } catch(e) { console.error('删除失败:', e); showToast('删除失败', 'error', e.message); }
    }

    // ============================================================
    //  清空所有
    // ============================================================
    async function clearAllRecords() {
        if (!confirm('确定删除所有记录吗？此操作不可恢复！')) return;
        try {
            for (const rec of records) {
                if (rec.audioMap) {
                    for (const [k, v] of Object.entries(rec.audioMap)) {
                        if (v.audioId) await deleteAudioFromDB(v.audioId);
                    }
                }
                await deletePDFFromDB(rec.id);
            }
            records = [];
            currentRecordId = null;
            pdfDoc = null;
            totalPages = 0;
            currentPage = 1;
            pageAudioMap.clear();
            audioElements = {};
            placeholder.style.display = 'block';
            canvas.style.display = 'none';
            updateUI();
            saveRecords();
            renderRecords();
            renderAudioList();
            audioStatusText.textContent = '已清空';
            showToast('已清空所有记录', 'info');
        } catch(e) { console.error('清空失败:', e); showToast('清空失败', 'error', e.message); }
    }

    // ============================================================
    //  加载记录
    // ============================================================
    async function loadRecord(id) {
        const rec = records.find(r => r.id === id);
        if (!rec) return;
        if (isLoading) return;
        isLoading = true;
        audioStatusText.textContent = '加载中...';

        try {
            currentRecordId = id;
            fileNameDisplay.textContent = rec.name || '未命名';
            fileDetailDisplay.textContent = rec.pages + ' 页 · ' + (rec.audioMap ? Object.keys(rec.audioMap).length : 0) + ' 个音频';

            const pdfData = await getPDFFromDB(id);
            if (pdfData) {
                const typedarray = new Uint8Array(pdfData);
                pdfDoc = await PDFJS.getDocument({ data: typedarray }).promise;
                totalPages = pdfDoc.numPages;
                currentPage = rec.currentPage || 1;

                pageAudioMap.clear();
                audioElements = {};
                if (rec.audioMap) {
                    for (const [k, v] of Object.entries(rec.audioMap)) {
                        const pageIdx = parseInt(k);
                        try {
                            const audioData = await getAudioFromDB(v.audioId);
                            if (audioData && audioData.data) {
                                const blob = new Blob([audioData.data]);
                                const url = URL.createObjectURL(blob);
                                pageAudioMap.set(pageIdx, {
                                    name: audioData.name || v.name,
                                    url: url,
                                    file: null,
                                    audioId: v.audioId
                                });
                            } else {
                                pageAudioMap.set(pageIdx, { name: v.name, url: null, file: null, audioId: v.audioId });
                            }
                        } catch(e) {
                            pageAudioMap.set(pageIdx, { name: v.name, url: null, file: null, audioId: v.audioId });
                        }
                    }
                }

                placeholder.style.display = 'none';
                canvas.style.display = 'block';
                zoomLevel = 1.0;
                panX = 0; panY = 0;
                baseScale = 1.0;

                renderPage(currentPage);
                updateUI();
                renderAudioList();
                audioStatusText.textContent = totalPages + '页 · ' + pageAudioMap.size + '音频';
            } else {
                placeholder.style.display = 'block';
                canvas.style.display = 'none';
                pdfDoc = null;
                totalPages = 0;
                currentPage = 1;
                pageAudioMap.clear();
                audioElements = {};
                updateUI();
                renderAudioList();
                audioStatusText.textContent = 'PDF丢失';
            }
            renderRecords();
            updatePlayBtn();
            updateTransform();
        } catch(e) {
            console.error('加载失败:', e);
            audioStatusText.textContent = '加载失败';
            placeholder.style.display = 'block';
            canvas.style.display = 'none';
            pdfDoc = null;
        } finally { isLoading = false; }
    }

    // ============================================================
    //  创建记录
    // ============================================================
    function createRecord(file) {
        const id = 'rec_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        const rec = { id, name: file.name, pages: 0, audioMap: {}, currentPage: 1, createdAt: new Date().toISOString() };
        records.unshift(rec);
        currentRecordId = id;
        saveRecords();
        renderRecords();
        return rec;
    }

    function updateRecordMetadata(pages) {
        const rec = records.find(r => r.id === currentRecordId);
        if (!rec) return;
        rec.pages = pages;
        rec.currentPage = currentPage;
        const newMap = {};
        for (const [k, v] of pageAudioMap.entries()) {
            newMap[k] = { name: v.name, audioId: v.audioId || ('audio_' + Date.now() + '_' + k) };
        }
        rec.audioMap = newMap;
        saveRecords();
        renderRecords();
        fileDetailDisplay.textContent = rec.pages + ' 页 · ' + Object.keys(rec.audioMap).length + ' 个音频';
    }

    // ============================================================
    //  PDF加载
    // ============================================================
    async function loadPDF(file) {
        if (isLoading) return;
        isLoading = true;
        audioStatusText.textContent = '加载PDF...';

        try {
            const reader = new FileReader();
            const arrayBuffer = await new Promise((resolve, reject) => {
                reader.onload = e => resolve(e.target.result);
                reader.onerror = e => reject(e.target.error);
                reader.readAsArrayBuffer(file);
            });

            let rec = records.find(r => r.name === file.name);
            if (!rec) {
                rec = createRecord(file);
            } else {
                currentRecordId = rec.id;
                if (rec.audioMap) {
                    for (const [k, v] of Object.entries(rec.audioMap)) {
                        if (v.audioId) await deleteAudioFromDB(v.audioId);
                    }
                }
                pageAudioMap.clear();
                audioElements = {};
                rec.audioMap = {};
            }

            await savePDFToDB(rec.id, arrayBuffer);

            const typedarray = new Uint8Array(arrayBuffer);
            pdfDoc = await PDFJS.getDocument({ data: typedarray }).promise;
            totalPages = pdfDoc.numPages;
            currentPage = 1;
            rec.pages = totalPages;

            fileNameDisplay.textContent = file.name;
            fileDetailDisplay.textContent = totalPages + ' 页 · 0 个音频';
            placeholder.style.display = 'none';
            canvas.style.display = 'block';

            zoomLevel = 1.0;
            panX = 0; panY = 0;
            baseScale = 1.0;

            renderPage(currentPage);
            updateUI();
            updateRecordMetadata(totalPages);
            saveRecords();
            renderRecords();
            renderAudioList();
            audioStatusText.textContent = totalPages + '页 · 就绪';
            showToast('PDF导入成功: ' + file.name, 'success', totalPages + ' 页');
        } catch(e) {
            console.error('PDF加载失败:', e);
            audioStatusText.textContent = '加载失败';
            showToast('PDF加载失败', 'error', e.message);
            placeholder.style.display = 'block';
            canvas.style.display = 'none';
            pdfDoc = null;
        } finally { isLoading = false; }
    }

    // ============================================================
    //  渲染音频列表
    // ============================================================
    function renderAudioList() {
        if (pageAudioMap.size === 0) {
            audioListContainer.innerHTML = `<div class="audio-list-empty">暂无音频，请批量添加</div>`;
            audioCountDisplay.textContent = '0 个';
            currentAudioName.textContent = '无音频';
            currentAudioName.style.color = '#94a3b8';
            return;
        }

        const sorted = Array.from(pageAudioMap.entries()).sort((a, b) => a[0] - b[0]);
        let html = '';
        for (const [pageIdx, data] of sorted) {
            const pageNum = pageIdx + 1;
            const isActive = pageIdx === currentPage - 1;
            const hasUrl = !!data.url;
            html += `
                <div class="audio-list-item ${isActive ? 'active' : ''}" data-page="${pageIdx}">
                    <span class="page-tag">P${pageNum}</span>
                    <span class="audio-name">${data.name || '未命名'}</span>
                    <span class="audio-status-icon">${hasUrl ? '✅' : '❌'}</span>
                    <button class="replace-btn" data-page="${pageIdx}" title="更换">↻</button>
                </div>
            `;
        }
        audioListContainer.innerHTML = html;
        audioCountDisplay.textContent = pageAudioMap.size + ' 个';

        document.querySelectorAll('.audio-list-item').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target.closest('.replace-btn')) return;
                const pageIdx = parseInt(this.dataset.page);
                if (!isNaN(pageIdx)) goToPage(pageIdx + 1);
            });
        });

        document.querySelectorAll('.replace-btn').forEach(el => {
            el.addEventListener('click', function(e) {
                e.stopPropagation();
                replaceTargetPage = parseInt(this.dataset.page);
                replaceAudioInput.click();
            });
        });

        const current = pageAudioMap.get(currentPage - 1);
        if (current && current.url) {
            currentAudioName.textContent = current.name || '音频';
            currentAudioName.style.color = '#475569';
        } else if (current) {
            currentAudioName.textContent = '⚠ ' + (current.name || '音频');
            currentAudioName.style.color = '#ef4444';
        } else {
            currentAudioName.textContent = '无音频';
            currentAudioName.style.color = '#94a3b8';
        }
    }

    // ============================================================
    //  更换音频
    // ============================================================
    async function replaceAudio(file, pageIndex) {
        if (!pdfDoc) { showToast('请先导入PDF', 'error'); return; }
        try {
            const reader = new FileReader();
            const arrayBuffer = await new Promise((resolve, reject) => {
                reader.onload = e => resolve(e.target.result);
                reader.onerror = e => reject(e.target.error);
                reader.readAsArrayBuffer(file);
            });

            const oldData = pageAudioMap.get(pageIndex);
            if (oldData && oldData.audioId) {
                await deleteAudioFromDB(oldData.audioId);
                if (oldData.url) URL.revokeObjectURL(oldData.url);
            }

            const audioId = 'audio_' + Date.now() + '_' + pageIndex;
            await saveAudioToDB(audioId, arrayBuffer, file.name);

            const url = URL.createObjectURL(file);
            pageAudioMap.set(pageIndex, { name: file.name, url, file, audioId });

            if (audioElements[pageIndex]) delete audioElements[pageIndex];

            updateRecordMetadata(totalPages);
            saveRecords();
            renderAudioList();
            showToast('已更换第 ' + (pageIndex + 1) + ' 页音频', 'success');

            if (pageIndex === currentPage - 1) setTimeout(() => autoPlay(), 300);
        } catch(e) {
            console.error('更换失败:', e);
            showToast('更换失败', 'error', e.message);
        }
    }

    // ============================================================
    //  渲染PDF
    // ============================================================
    function calculateFitScale(pageWidth, pageHeight) {
        const rect = viewport.getBoundingClientRect();
        const scaleX = (rect.width - 40) / pageWidth;
        const scaleY = (rect.height - 40) / pageHeight;
        return Math.min(scaleX, scaleY, 2.0);
    }

    let currentRenderTask = null;

    function renderPage(num) {
        if (!pdfDoc) { placeholder.style.display = 'block'; canvas.style.display = 'none'; return; }
        
        if (currentRenderTask) {
            currentRenderTask.cancel();
            currentRenderTask = null;
        }

        pdfDoc.getPage(num).then(page => {
            const vp = page.getViewport({ scale: 1 });
            baseScale = calculateFitScale(vp.width, vp.height);
            const totalScale = baseScale * zoomLevel;
            const svp = page.getViewport({ scale: totalScale });
            canvas.width = svp.width;
            canvas.height = svp.height;
            
            const renderTask = page.render({ canvasContext: ctx, viewport: svp });
            currentRenderTask = renderTask;
            return renderTask.promise;
        }).then(() => {
            currentRenderTask = null;
            canvas.style.display = 'block';
            placeholder.style.display = 'none';
            updateTransform();
            renderAudioList();
            setTimeout(() => autoPlay(), 300);
        }).catch(err => {
            if (err.name !== 'RenderingCancelledException') {
                console.warn('渲染警告:', err);
            }
            currentRenderTask = null;
        });
    }

    function updateTransform() {
        canvasWrapper.style.transform = `translate(${panX}px, ${panY}px)`;
        zoomLevelDisplay.textContent = Math.round(zoomLevel * 100) + '%';
    }

    // ============================================================
    //  缩放/平移
    // ============================================================
    function setupPanZoom() {
        viewport.addEventListener('wheel', function(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.1 : 0.1;
            const newZoom = Math.min(Math.max(0.3, zoomLevel + delta), 3.0);
            if (newZoom !== zoomLevel) { zoomLevel = newZoom; if (pdfDoc) renderPage(currentPage); else updateTransform(); }
        }, { passive: false });

        let isPanning = false, startX, startY, startPanX, startPanY;
        viewport.addEventListener('mousedown', function(e) {
            if (e.button !== 0 || !pdfDoc) return;
            isPanning = true;
            startX = e.clientX; startY = e.clientY;
            startPanX = panX; startPanY = panY;
            viewport.style.cursor = 'grabbing';
        });
        window.addEventListener('mousemove', function(e) {
            if (!isPanning) return;
            panX = startPanX + (e.clientX - startX);
            panY = startPanY + (e.clientY - startY);
            updateTransform();
        });
        window.addEventListener('mouseup', function() {
            if (isPanning) { isPanning = false; viewport.style.cursor = 'default'; }
        });

        let touchStartX, touchStartY, touchStartPanX, touchStartPanY, lastTouchDist = 0, isTouching = false;
        viewport.addEventListener('touchstart', function(e) {
            if (!pdfDoc) return;
            const t = e.touches;
            if (t.length === 1) {
                isTouching = true;
                touchStartX = t[0].clientX; touchStartY = t[0].clientY;
                touchStartPanX = panX; touchStartPanY = panY;
            } else if (t.length === 2) {
                const dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
                lastTouchDist = Math.sqrt(dx*dx + dy*dy);
            }
        }, { passive: true });
        viewport.addEventListener('touchmove', function(e) {
            if (!pdfDoc) return;
            const t = e.touches;
            if (t.length === 1 && isTouching) {
                panX = touchStartPanX + (t[0].clientX - touchStartX);
                panY = touchStartPanY + (t[0].clientY - touchStartY);
                updateTransform();
            } else if (t.length === 2) {
                const dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const scale = dist / lastTouchDist;
                const newZoom = Math.min(Math.max(0.3, zoomLevel * scale), 3.0);
                if (newZoom !== zoomLevel) { zoomLevel = newZoom; if (pdfDoc) renderPage(currentPage); else updateTransform(); }
                lastTouchDist = dist;
            }
        }, { passive: true });
        viewport.addEventListener('touchend', function() { isTouching = false; }, { passive: true });

        window.addEventListener('resize', function() { if (pdfDoc) renderPage(currentPage); });
    }

    // ============================================================
    //  音频
    // ============================================================
    async function addAudios(files) {
        if (!pdfDoc) { showToast('请先导入PDF', 'error'); return; }
        const fileArray = Array.from(files);
        let added = 0;
        for (let i = 0; i < fileArray.length; i++) {
            const file = fileArray[i];
            const pageIndex = i;
            if (pageIndex >= totalPages) { showToast('超过页数(' + totalPages + '页)', 'error'); break; }
            try {
                const reader = new FileReader();
                const arrayBuffer = await new Promise((resolve, reject) => {
                    reader.onload = e => resolve(e.target.result);
                    reader.onerror = e => reject(e.target.error);
                    reader.readAsArrayBuffer(file);
                });
                const audioId = 'audio_' + Date.now() + '_' + i;
                await saveAudioToDB(audioId, arrayBuffer, file.name);
                if (pageAudioMap.has(pageIndex)) {
                    const old = pageAudioMap.get(pageIndex);
                    if (old.url) URL.revokeObjectURL(old.url);
                    if (old.audioId) await deleteAudioFromDB(old.audioId);
                }
                const url = URL.createObjectURL(file);
                pageAudioMap.set(pageIndex, { name: file.name, url, file, audioId });
                if (audioElements[pageIndex]) delete audioElements[pageIndex];
                added++;
            } catch(e) { console.error('保存音频失败:', e); showToast('音频保存失败', 'error', e.message); }
        }
        updateRecordMetadata(totalPages);
        saveRecords();
        renderRecords();
        renderAudioList();
        showToast('添加了 ' + added + ' 个音频', 'success');
        if (pageAudioMap.has(currentPage - 1)) setTimeout(() => autoPlay(), 300);
    }

    function formatTime(seconds) {
        if (!seconds || isNaN(seconds)) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + ':' + s.toString().padStart(2, '0');
    }

    function setupAudioPlayer() {
        progressBar.addEventListener('click', function(e) {
            if (!currentAudio) return;
            const rect = this.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            currentAudio.currentTime = x * (currentAudio.duration || 0);
        });
    }

    function autoPlay() {
        const pageIndex = currentPage - 1;
        const audioData = pageAudioMap.get(pageIndex);
        if (!audioData || !audioData.url) {
            if (currentAudio) { currentAudio.pause(); currentAudio = null; isPlaying = false; updatePlayBtn(); }
            currentAudioName.textContent = audioData ? '⚠ 文件缺失' : '无音频';
            currentAudioName.style.color = audioData ? '#ef4444' : '#94a3b8';
            durationDisplay.textContent = '0:00';
            currentTimeDisplay.textContent = '0:00';
            progressFill.style.width = '0%';
            return;
        }
        currentAudioName.textContent = audioData.name || '音频';
        currentAudioName.style.color = '#475569';

        let audio = audioElements[pageIndex];
        if (!audio) {
            audio = new Audio(audioData.url);
            audio.dataset.page = pageIndex;
            audio.addEventListener('ended', function() {
                if (currentAudio === this) { currentAudio = null; isPlaying = false; updatePlayBtn(); }
                progressFill.style.width = '100%';
                currentTimeDisplay.textContent = durationDisplay.textContent;
            });
            audio.addEventListener('timeupdate', function() {
                if (currentAudio === this) {
                    const current = this.currentTime || 0;
                    const duration = this.duration || 0;
                    currentTimeDisplay.textContent = formatTime(current);
                    durationDisplay.textContent = formatTime(duration);
                    progressFill.style.width = (duration > 0 ? (current / duration * 100) : 0) + '%';
                }
            });
            audio.addEventListener('loadedmetadata', function() {
                durationDisplay.textContent = formatTime(this.duration);
            });
            audio.addEventListener('error', function() { audioStatusText.textContent = '音频加载失败'; });
            audioElements[pageIndex] = audio;
        }
        if (currentAudio && currentAudio !== audio) currentAudio.pause();
        audio.play().then(() => {
            currentAudio = audio;
            isPlaying = true;
            updatePlayBtn();
            audioStatusText.textContent = '播放中';
            durationDisplay.textContent = formatTime(audio.duration);
        }).catch(() => {
            audioStatusText.textContent = '点击播放';
            currentAudio = audio;
            isPlaying = false;
            updatePlayBtn();
        });
    }

    function togglePlay() {
        const pageIndex = currentPage - 1;
        const audioData = pageAudioMap.get(pageIndex);
        if (!audioData || !audioData.url) { audioStatusText.textContent = '无音频'; return; }
        let audio = audioElements[pageIndex];
        if (!audio) {
            audio = new Audio(audioData.url);
            audio.dataset.page = pageIndex;
            audio.addEventListener('ended', function() {
                if (currentAudio === this) { currentAudio = null; isPlaying = false; updatePlayBtn(); }
            });
            audio.addEventListener('timeupdate', function() {
                if (currentAudio === this) {
                    const current = this.currentTime || 0;
                    const duration = this.duration || 0;
                    currentTimeDisplay.textContent = formatTime(current);
                    durationDisplay.textContent = formatTime(duration);
                    progressFill.style.width = (duration > 0 ? (current / duration * 100) : 0) + '%';
                }
            });
            audio.addEventListener('loadedmetadata', function() {
                durationDisplay.textContent = formatTime(this.duration);
            });
            audio.addEventListener('error', function() { audioStatusText.textContent = '音频错误'; });
            audioElements[pageIndex] = audio;
        }
        if (currentAudio && currentAudio !== audio) currentAudio.pause();
        if (audio.paused) {
            audio.play().then(() => {
                currentAudio = audio;
                isPlaying = true;
                updatePlayBtn();
                audioStatusText.textContent = '播放中';
                durationDisplay.textContent = formatTime(audio.duration);
            }).catch(() => { audioStatusText.textContent = '播放失败'; });
        } else {
            audio.pause();
            isPlaying = false;
            updatePlayBtn();
            audioStatusText.textContent = '已暂停';
        }
    }

    function stopAudio() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            isPlaying = false;
            updatePlayBtn();
            audioStatusText.textContent = '已停止';
            currentTimeDisplay.textContent = '0:00';
            progressFill.style.width = '0%';
        }
    }

    function updatePlayBtn() {
        playBtn.textContent = isPlaying ? '⏸' : '▶';
        playBtn.className = isPlaying ? 'playing' : '';
        if (isPlaying) audioStatusText.textContent = '播放中';
    }

    // ============================================================
    //  UI
    // ============================================================
    function updateUI() {
        pageInfoDisplay.innerHTML = totalPages > 0 ? currentPage + ' <span class="total">/ ' + totalPages + '</span>' : '0 <span class="total">/ 0</span>';
        prevPageBtn.disabled = (currentPage <= 1 || totalPages === 0);
        nextPageBtn.disabled = (currentPage >= totalPages || totalPages === 0);
        if (pdfDoc) { placeholder.style.display = 'none'; canvas.style.display = 'block'; }
        else { placeholder.style.display = 'block'; canvas.style.display = 'none'; }
    }

    function goToPage(num) {
        if (!pdfDoc) return;
        if (num < 1) num = 1;
        if (num > totalPages) num = totalPages;
        if (num === currentPage) { autoPlay(); return; }
        currentPage = num;
        renderPage(currentPage);
        updateUI();
        const rec = records.find(r => r.id === currentRecordId);
        if (rec) { rec.currentPage = currentPage; saveRecords(); }
    }

    // ============================================================
    //  侧边栏切换
    // ============================================================
    function toggleSidebar() { sidebar.classList.toggle('open'); sidebarOverlay.classList.toggle('active'); }
    function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); }

    // ============================================================
    //  初始化
    // ============================================================
    async function init() {
        try { await openDB(); console.log('IndexedDB 已打开'); } catch(e) { console.warn('IndexedDB 打开失败:', e); }

        loadRecords();
        renderRecords();
        setupPanZoom();
        setupAudioPlayer();

        if (window.innerWidth <= 768) toggleSidebarBtn.style.display = 'flex';

        // ---- 导入PDF ----
        document.getElementById('importPdfBtn').addEventListener('click', function(e) {
            if (e.target.tagName !== 'INPUT') pdfFileInput.click();
        });
        pdfFileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (file) { loadPDF(file); }
            this.value = '';
        });

        // ---- 导入音频 ----
        document.getElementById('importAudioBtn').addEventListener('click', function(e) {
            if (e.target.tagName !== 'INPUT') audioFileInput.click();
        });
        audioFileInput.addEventListener('change', function(e) {
            const files = this.files;
            if (files.length > 0) { addAudios(files); }
            this.value = '';
        });

        // ---- 更换音频 ----
        replaceAudioInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (file && replaceTargetPage !== null) {
                replaceAudio(file, replaceTargetPage);
                replaceTargetPage = null;
            }
            this.value = '';
        });

        // ---- 导出全部ZIP ----
        exportAllBtn.addEventListener('click', async function() {
            if (records.length === 0) {
                showToast('没有数据可导出', 'error');
                return;
            }
            this.disabled = true;
            try {
                const blob = await exportAllData();
                const link = document.createElement('a');
                link.download = '有声书库_' + new Date().toISOString().slice(0,10) + '.zip';
                link.href = URL.createObjectURL(blob);
                link.click();
                URL.revokeObjectURL(link.href);
                showToast('导出成功', 'success', (blob.size / 1024 / 1024).toFixed(1) + ' MB');
            } catch(e) {
                console.error(e);
                showToast('导出失败', 'error', e.message);
            }
            this.disabled = false;
        });

        // ---- 导入ZIP ----
        importZipBtn.addEventListener('click', function() {
            zipFileInput.click();
        });
        zipFileInput.addEventListener('change', async function(e) {
            const file = this.files[0];
            if (!file) return;
            this.value = '';
            if (!file.name.endsWith('.zip')) {
                showToast('请选择ZIP文件', 'error');
                return;
            }
            importZipBtn.disabled = true;
            try {
                const blob = await file.arrayBuffer();
                await importAllData(blob);
                showToast('导入成功', 'success', records.length + ' 个绘本');
            } catch(e) {
                console.error(e);
                showToast('导入失败', 'error', e.message);
            }
            importZipBtn.disabled = false;
        });

        // ---- 清空 ----
        clearAllBtn.addEventListener('click', clearAllRecords);

        // ---- 侧边栏切换 ----
        toggleSidebarBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);

        // ---- 翻页 ----
        prevPageBtn.addEventListener('click', function() { goToPage(currentPage - 1); });
        nextPageBtn.addEventListener('click', function() { goToPage(currentPage + 1); });

        // ---- 缩放 ----
        zoomInBtn.addEventListener('click', function() {
            zoomLevel = Math.min(3.0, zoomLevel + 0.15);
            if (pdfDoc) renderPage(currentPage); else updateTransform();
        });
        zoomOutBtn.addEventListener('click', function() {
            zoomLevel = Math.max(0.3, zoomLevel - 0.15);
            if (pdfDoc) renderPage(currentPage); else updateTransform();
        });
        zoomResetBtn.addEventListener('click', function() {
            zoomLevel = 1.0;
            panX = 0; panY = 0;
            if (pdfDoc) renderPage(currentPage); else updateTransform();
        });

        // ---- 音频控制 ----
        playBtn.addEventListener('click', togglePlay);
        stopBtn.addEventListener('click', stopAudio);

        // ---- 键盘 ----
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowLeft') { e.preventDefault(); goToPage(currentPage - 1); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); goToPage(currentPage + 1); }
            else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
        });

        // ---- 点击画布切换播放 ----
        canvas.addEventListener('click', togglePlay);

        // ---- 窗口resize ----
        window.addEventListener('resize', function() {
            if (window.innerWidth <= 768) { toggleSidebarBtn.style.display = 'flex'; }
            else { toggleSidebarBtn.style.display = 'none'; closeSidebar(); }
            if (pdfDoc) renderPage(currentPage);
        });

        updateUI();
        updatePlayBtn();
        renderAudioList();
        console.log('应用初始化完成，记录数:', records.length);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

})();
</script>
</body>
</html>
