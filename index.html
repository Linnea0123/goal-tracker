            }

            function createRecord(file) {
                const id = 'rec_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                const rec = { id, name: file.name, pages: 0, audioMap: {}, currentPage: 1, createdAt: new Date()
                        .toISOString() };
                records.unshift(rec);
                currentRecordId = id;
                saveRecords();
                renderRecords();
                topBarStatus.textContent = file.name || '已导入';
                return rec;
            }

            function updateRecordMetadata(pages) {
                const rec = records.find(r => r.id === currentRecordId);
                if (!rec) return;
                rec.pages = pages;
                rec.currentPage = currentPage;
                const newMap = {};
                for (const [k, v] of pageAudioMap.entries()) {
                    newMap[k] = { name: v.name, audioId: v.audioId || ('audio_' + Date.now() + '_' + k) };
                }
                rec.audioMap = newMap;
                saveRecords();
                renderRecords();
                const audioCount = Object.keys(rec.audioMap).length;
                fileDetailDisplay.textContent = rec.pages + ' 页 · ' + audioCount + ' 个音频';
            }

            // ============================================================
            //  loadPDF - 导入新PDF时重置音频
            // ============================================================

            async function loadPDF(file) {
                if (isLoading) return;
                isLoading = true;
                audioStatusText.textContent = '加载PDF...';
                topBarStatus.textContent = '加载中...';

                try {
                    const reader = new FileReader();
                    const arrayBuffer = await new Promise((resolve, reject) => {
                        reader.onload = e => resolve(e.target.result);
                        reader.onerror = e => reject(e.target.error);
                        reader.readAsArrayBuffer(file);
                    });

                    let rec = records.find(r => r.name === file.name);
                    if (!rec) {
                        rec = createRecord(file);
                    } else {
                        currentRecordId = rec.id;
                        if (rec.audioMap) {
                            for (const [k, v] of Object.entries(rec.audioMap)) {
                                if (v.audioId) await deleteAudioFromDB(v.audioId);
                            }
                        }
                        pageAudioMap.clear();
                        audioElements = {};
                        rec.audioMap = {};
                        rec.pages = 0;
                        stopTimer();
                        
                    }

                    await savePDFToDB(rec.id, arrayBuffer);

                    const typedarray = new Uint8Array(arrayBuffer);
                    pdfDoc = await PDFJS.getDocument({ data: typedarray }).promise;
                    totalPages = pdfDoc.numPages;
                    currentPage = 1;
                    rec.pages = totalPages;
                    rec.audioMap = {};

                    fileNameDisplay.textContent = file.name;
                    fileDetailDisplay.textContent = totalPages + ' 页 · 0 个音频';
                    placeholder.style.display = 'none';
                    canvas.style.display = 'block';

                    zoomLevel = 1.0;
                    panX = 0;
                    panY = 0;
                    baseScale = 1.0;
                    pageCache.clear();

                    renderPage(currentPage);
                    updateUI();

                    saveRecords();
                    renderRecords();
                    renderAudioList();

                    audioStatusText.textContent = totalPages + '页 · 0 音频';
                    topBarStatus.textContent = file.name || '已加载';
                    loadTimerFromRecord(rec.id);
                    showToast('PDF导入成功: ' + file.name, 'success', totalPages + ' 页');
                } catch (e) {
                    console.error('PDF加载失败:', e);
                    audioStatusText.textContent = '加载失败';
                    topBarStatus.textContent = '加载失败';
                    showToast('PDF加载失败', 'error', e.message);
                    placeholder.style.display = 'block';
                    canvas.style.display = 'none';
                    pdfDoc = null;
                } finally { isLoading = false; }
            }

            function renderAudioList() {
                if (pageAudioMap.size === 0) {
                    audioListContainer.innerHTML = `<div class="audio-list-empty">暂无音频，请批量添加</div>`;
                    audioCountDisplay.textContent = '0 个';
                    currentAudioName.textContent = '无音频';
                    currentAudioName.style.color = '#94a3b8';
                    return;
                }

                const sorted = Array.from(pageAudioMap.entries()).sort((a, b) => a[0] - b[0]);
                let html = '';
                for (const [pageIdx, data] of sorted) {
                    const pageNum = pageIdx + 1;
                    const isActive = pageIdx === currentPage - 1;
                    const hasUrl = !!data.url;
                    html += `
                            <div class="audio-list-item ${isActive ? 'active' : ''}" data-page="${pageIdx}">
                                <span class="page-tag">P${pageNum}</span>
                                <span class="audio-name">${data.name || '未命名'}</span>
                                <span class="audio-status-icon">${hasUrl ? '✅' : '❌'}</span>
                                <button class="replace-btn" data-page="${pageIdx}" title="更换">↻</button>
                            </div>
                        `;
                }
                audioListContainer.innerHTML = html;
                audioCountDisplay.textContent = pageAudioMap.size + ' 个';

                document.querySelectorAll('.audio-list-item').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('.replace-btn')) return;
                        const pageIdx = parseInt(this.dataset.page);
                        if (!isNaN(pageIdx)) goToPage(pageIdx + 1);
                    });
                });

                document.querySelectorAll('.replace-btn').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        replaceTargetPage = parseInt(this.dataset.page);
                        replaceAudioInput.click();
                    });
                });

                const current = pageAudioMap.get(currentPage - 1);
                if (current && current.url) {
                    currentAudioName.textContent = current.name || '音频';
                    currentAudioName.style.color = '#475569';
                } else if (current) {
                    currentAudioName.textContent = '⚠ ' + (current.name || '音频');
                    currentAudioName.style.color = '#ef4444';
                } else {
                    currentAudioName.textContent = '无音频';
                    currentAudioName.style.color = '#94a3b8';
                }
            }

            async function replaceAudio(file, pageIndex) {
                if (!pdfDoc) { showToast('请先导入PDF', 'error'); return; }
                try {
                    const reader = new FileReader();
                    const arrayBuffer = await new Promise((resolve, reject) => {
                        reader.onload = e => resolve(e.target.result);
                        reader.onerror = e => reject(e.target.error);
                        reader.readAsArrayBuffer(file);
                    });

                    const oldData = pageAudioMap.get(pageIndex);
                    if (oldData && oldData.audioId) {
                        await deleteAudioFromDB(oldData.audioId);
                        if (oldData.url) URL.revokeObjectURL(oldData.url);
                    }

                    const audioId = 'audio_' + Date.now() + '_' + pageIndex;
                    await saveAudioToDB(audioId, arrayBuffer, file.name);

                    const url = URL.createObjectURL(file);
                    pageAudioMap.set(pageIndex, { name: file.name, url, file, audioId });

                    if (audioElements[pageIndex]) delete audioElements[pageIndex];

                    updateRecordMetadata(totalPages);
                    saveRecords();
                    renderAudioList();
                    showToast('已更换第 ' + (pageIndex + 1) + ' 页音频', 'success');

                    if (pageIndex === currentPage - 1) setTimeout(() => autoPlay(), 300);
                } catch (e) {
                    console.error('更换失败:', e);
                    showToast('更换失败', 'error', e.message);
                }
            }

            // ============================================================
            //  导入ZIP - 按文件夹导入
            // ============================================================

  // ============================================================
//  导入ZIP - 按文件夹导入（修复版）
// ============================================================

async function importAllData(zipBlob) {
    const zip = await JSZip.loadAsync(zipBlob);
    
    // 遍历ZIP中的所有顶级文件夹
    const folders = [];
    zip.forEach((relativePath, file) => {
        const parts = relativePath.split('/');
        if (parts.length >= 2 && !file.dir) {
            const folderName = parts[0];
            if (!folders.includes(folderName)) {
                folders.push(folderName);
            }
        }
    });

    if (folders.length === 0) {
        throw new Error('无效的ZIP文件：未找到绘本文件夹');
    }

    let importedCount = 0;
    
    for (const folderName of folders) {
        const folder = zip.folder(folderName);
        if (!folder) continue;
        
        // 查找PDF文件
        let pdfFile = null;
        let pdfFileName = null;
        folder.forEach((relativePath, file) => {
            if (!file.dir && /\.pdf$/i.test(relativePath)) {
                pdfFile = file;
                pdfFileName = relativePath;
            }
        });
        
        if (!pdfFile) continue;
        
        // 读取PDF数据
        const pdfData = await pdfFile.async('arraybuffer');
        
        // 查找音频文件
        const audioFiles = [];
        folder.forEach((relativePath, file) => {
            if (!file.dir && /\.(mp3|wav|aac|ogg|m4a)$/i.test(relativePath)) {
                audioFiles.push({ name: relativePath, file: file });
            }
        });
        
        // ✅ 修复：直接创建记录，不使用 createRecord
        const recordId = 'rec_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        const rec = { 
            id: recordId, 
            name: pdfFileName || folderName + '.pdf', 
            pages: 0, 
            audioMap: {}, 
            currentPage: 1, 
            createdAt: new Date().toISOString() 
        };
        records.unshift(rec);
        currentRecordId = recordId;
        
        // 保存PDF
        await savePDFToDB(rec.id, pdfData);
        
        // 加载PDF获取页数
        const typedarray = new Uint8Array(pdfData);
        const tempDoc = await PDFJS.getDocument({ data: typedarray }).promise;
        rec.pages = tempDoc.numPages;
        
        // 保存音频
        const audioMap = {};
        for (let i = 0; i < audioFiles.length && i < rec.pages; i++) {
            const audioFile = audioFiles[i];
            const audioData = await audioFile.file.async('arraybuffer');
            const audioId = 'audio_' + Date.now() + '_' + i + '_' + Math.random().toString(36).substr(2, 4);
            await saveAudioToDB(audioId, audioData, audioFile.name);
            audioMap[i] = { name: audioFile.name, audioId: audioId };
        }
        rec.audioMap = audioMap;
        
        saveRecords();
        importedCount++;
    }
    
    // 重新加载第一个记录
    if (records.length > 0) {
        await loadRecord(records[0].id);
    }
    renderRecords();
    renderAudioList();
    
    return importedCount;
}
            // ============================================================
            //  初始化
            // ============================================================
async function init() {
    try {
        await openDB();
        console.log('IndexedDB 已打开');
    } catch (e) {
        console.warn('IndexedDB 打开失败:', e);
    }

    loadRecords();
    renderRecords();
    setupPanZoom();
    setupAudioPlayer();

    if (window.innerWidth <= 768) {
        menuToggle.style.display = 'flex';
    }

    // 导入PDF
    document.getElementById('importPdfBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        e.preventDefault();
        pdfFileInput.click();
    });
    pdfFileInput.addEventListener('change', function(e) {
        const file = this.files[0];
        if (file) { loadPDF(file); }
        this.value = '';
    });

    // 导入音频
    document.getElementById('importAudioBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        e.preventDefault();
        audioFileInput.click();
    });
    audioFileInput.addEventListener('change', function(e) {
        const files = this.files;
        if (files.length > 0) { addAudios(files); }
        this.value = '';
    });

    replaceAudioInput.addEventListener('change', function(e) {
        const file = this.files[0];
        if (file && replaceTargetPage !== null) {
            replaceAudio(file, replaceTargetPage);
            replaceTargetPage = null;
        }
        this.value = '';
    });

    // 导出全部ZIP
    exportAllBtn.addEventListener('click', async function() {
        if (records.length === 0) {
            showToast('没有数据可导出', 'error');
            return;
        }
        this.disabled = true;
        try {
            const blob = await exportAllData();
            const link = document.createElement('a');
            link.download = '有声书库_' + new Date().toISOString().slice(0, 10) + '.zip';
            link.href = URL.createObjectURL(blob);
            link.click();
            URL.revokeObjectURL(link.href);
            showToast('导出成功', 'success', (blob.size / 1024 / 1024).toFixed(1) + ' MB');
        } catch (e) {
            console.error(e);
            showToast('导出失败', 'error', e.message);
        }
        this.disabled = false;
    });

    // ========================================
    // 导入ZIP - 完全重建版（修复点击无反应）
    // ========================================
    // 移除旧的 input
    const oldZipInput = document.getElementById('zipFileInput');
    if (oldZipInput) {
        oldZipInput.remove();
    }

    // 创建全新的 input（覆盖整个屏幕，透明，确保能触发）
    const newZipInput = document.createElement('input');
    newZipInput.type = 'file';
    newZipInput.accept = '.zip';
    newZipInput.id = 'zipFileInput';
    // ✅ 修复代码
newZipInput.style.display = 'none';
    document.body.appendChild(newZipInput);

    // 重新创建按钮（清除所有旧事件）
    const oldZipBtn = document.getElementById('importZipBtn');
    const newZipBtn = oldZipBtn.cloneNode(true);
    if (oldZipBtn) {
        oldZipBtn.parentNode.replaceChild(newZipBtn, oldZipBtn);
    }

    const finalZipBtn = document.getElementById('importZipBtn');
    const finalZipInput = document.getElementById('zipFileInput');

    // 绑定点击事件
    finalZipBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        e.preventDefault();
        finalZipInput.click();
    });

    // 绑定文件选择事件
    finalZipInput.addEventListener('change', async function(e) {
        const file = this.files[0];
        if (!file) {
            this.value = '';
            return;
        }
        this.value = '';
        if (!file.name.endsWith('.zip')) {
            showToast('请选择ZIP文件', 'error');
            this.style.display = 'block';
            return;
        }
        finalZipBtn.disabled = true;
        try {
            const blob = await file.arrayBuffer();
            const count = await importAllData(blob);
            showToast('导入成功', 'success', '导入了 ' + count + ' 个绘本');
        } catch (e) {
            console.error(e);
            showToast('导入失败: ' + e.message, 'error');
        }
        finalZipBtn.disabled = false;
        this.style.display = 'block';
    });

    clearAllBtn.addEventListener('click', clearAllRecords);

    menuToggle.addEventListener('click', toggleSidebar);
    sidebarOverlay.addEventListener('click', function(e) {
        if (e.target === this) {
            closeSidebar();
        }
    });

    prevPageBtn.addEventListener('click', function() { goToPage(currentPage - 1); });
    nextPageBtn.addEventListener('click', function() { goToPage(currentPage + 1); });

    zoomInBtn.addEventListener('click', function() {
        handleZoomChange(zoomLevel * 1.3);
    });
    zoomOutBtn.addEventListener('click', function() {
        handleZoomChange(zoomLevel / 1.3);
    });
    zoomResetBtn.addEventListener('click', resetZoom);

    playBtn.addEventListener('click', togglePlay);
    stopBtn.addEventListener('click', stopAudio);

    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'ArrowLeft') {
            e.preventDefault();
            goToPage(currentPage - 1);
        } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            goToPage(currentPage + 1);
        } else if (e.key === ' ') {
            e.preventDefault();
            togglePlay();
        }
    });

    canvas.addEventListener('click', togglePlay);

    window.addEventListener('beforeunload', function() {
        stopTimer();
    });

    window.addEventListener('visibilitychange', function() {
        if (document.hidden) {
            pauseTimer();
        } else {
            if (currentRecordId) {
                resumeTimer(currentRecordId);
            }
        }
    });

    window.addEventListener('resize', function() {
        if (window.innerWidth <= 768) {
            menuToggle.style.display = 'flex';
        } else {
            menuToggle.style.display = 'none';
            closeSidebar();
        }
        if (pdfDoc) {
            pageCache.clear();
            renderPage(currentPage);
        }
    });

    updateUI();
    updatePlayBtn();
    renderAudioList();
    console.log('应用初始化完成，记录数:', records.length);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

        })();
    </script>
