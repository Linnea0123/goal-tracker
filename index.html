<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>有声PDF阅读器 · 绘本版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
    </script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            -webkit-user-select: none;
            user-select: none;
        }

        .app {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #f0f2f5;
        }

        .sidebar {
            width: 260px;
            min-width: 260px;
            height: 100%;
            background: #ffffff;
            border-right: 1px solid #e4e7ec;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
            transition: transform 0.3s;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 12px 16px 8px;
            border-bottom: 1px solid #eef0f4;
            flex-shrink: 0;
        }
        .sidebar-header h2 {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
        }
        .sidebar-header .sub {
            font-size: 9px;
            color: #94a3b8;
            margin-top: 1px;
        }
        .sidebar-actions {
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex-shrink: 0;
            border-bottom: 1px solid #eef0f4;
        }

        .btn-side {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 6px 8px;
            border-radius: 6px;
            border: none;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            background: #f1f5f9;
            color: #1e293b;
            width: 100%;
            position: relative;
        }
        .btn-side:hover {
            background: #e2e8f0;
        }
        .btn-side:active {
            transform: scale(0.97);
        }
        .btn-side:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-side input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            cursor: pointer;
        }
        .btn-side.danger {
            background: #f1f5f9;
            color: #dc2626;
        }
        .btn-side.danger:hover {
            background: #fee2e2;
        }

        .btn-side .badge {
            background: #ef4444;
            color: white;
            font-size: 8px;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-left: 2px;
        }

        .sidebar-divider {
            border: none;
            border-top: 1px solid #eef0f4;
            margin: 3px 0;
        }

        .record-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px;
            -webkit-overflow-scrolling: touch;
        }
        .record-list::-webkit-scrollbar {
            width: 3px;
        }
        .record-list::-webkit-scrollbar-thumb {
            background: #d1d9e6;
            border-radius: 4px;
        }

        .record-item {
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 3px;
            cursor: pointer;
            transition: all 0.15s;
            background: transparent;
            border: 1px solid transparent;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .record-item:hover {
            background: #f8fafc;
        }
        .record-item.active {
            background: #eff6ff;
            border-color: #bfdbfe;
        }
        .record-item .info {
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }
        .record-item .name {
            font-weight: 600;
            font-size: 11px;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .record-item .meta {
            font-size: 9px;
            color: #94a3b8;
            margin-top: 1px;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .record-item .badge-pages {
            background: #e2e8f0;
            padding: 0 5px;
            border-radius: 6px;
            font-size: 8px;
        }
        .record-item .item-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }
        .record-item .item-actions button {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 11px;
            padding: 2px 4px;
            border-radius: 4px;
            transition: all 0.15s;
        }
        .record-item .item-actions button:hover {
            background: #eef2f6;
            color: #3b82f6;
        }
        .record-item .item-actions .delete-btn:hover {
            background: #fee2e2;
            color: #dc2626;
        }
        .record-item .item-actions .export-btn:hover {
            background: #dcfce7;
            color: #16a34a;
        }
        .record-empty {
            text-align: center;
            color: #94a3b8;
            padding: 20px 12px;
            font-size: 11px;
        }

        .top-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: #ffffff;
            border-bottom: 1px solid #e4e7ec;
            flex-shrink: 0;
            z-index: 10;
            min-height: 44px;
        }
        .top-bar .brand {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
            white-space: nowrap;
        }
        .top-bar .brand-sub {
            font-size: 9px;
            color: #94a3b8;
            margin-left: 4px;
            font-weight: 400;
        }
        .top-bar .menu-toggle {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            color: #1e293b;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .top-bar .menu-toggle:hover {
            background: #f1f5f9;
            border-radius: 6px;
        }
        .top-bar .status {
            font-size: 10px;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 99;
        }
        .sidebar-overlay.active {
            display: block;
        }

        .main-content {
            flex: 1;
            display: flex;
            height: 100%;
            overflow: hidden;
            background: #e8ecf1;
            position: relative;
        }

        .pdf-viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #e8ecf1;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pdf-viewport .canvas-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            cursor: grab;
            width: 100%;
            height: 100%;
        }
        .pdf-viewport .canvas-wrapper:active {
            cursor: grabbing;
        }
        #pdfCanvas {
            display: none;
            background: white;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            touch-action: none;
            max-width: 100%;
            max-height: 100%;
        }
        .pdf-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #94a3b8;
            font-size: 15px;
            text-align: center;
            pointer-events: none;
        }
        .pdf-placeholder .big-icon {
            font-size: 36px;
            display: block;
            margin-bottom: 8px;
        }

        .right-toolbar {
            width: 280px;
            min-width: 280px;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-left: 1px solid rgba(226, 232, 240, 0.5);
            display: flex;
            flex-direction: column;
            padding: 12px 14px 16px;
            z-index: 15;
            flex-shrink: 0;
            overflow-y: auto;
            gap: 6px;
        }
        .right-toolbar::-webkit-scrollbar {
            width: 3px;
        }
        .right-toolbar::-webkit-scrollbar-thumb {
            background: #d1d9e6;
            border-radius: 4px;
        }

        .tool-section {
            background: #f8fafc;
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid #eef0f4;
        }
        .tool-section .section-title {
            font-size: 9px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .file-info .name {
            font-weight: 600;
            font-size: 13px;
            color: #0f172a;
            word-break: break-all;
            line-height: 1.3;
        }
        .file-info .detail {
            font-size: 11px;
            color: #94a3b8;
        }
        .reading-timer {
            display: none;
            margin-top: 6px;
            padding: 4px 10px;
            background: #eff6ff;
            border-radius: 6px;
            font-size: 12px;
            color: #1e40af;
            align-items: center;
            gap: 6px;
            border: 1px solid #bfdbfe;
        }
        .reading-timer.active {
            display: flex !important;
        }
        .reading-timer .timer-value {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            min-width: 70px;
        }
        .reading-timer .timer-label {
            font-size: 10px;
            color: #64748b;
            margin-left: auto;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-controls button {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            background: white;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            transition: all 0.15s;
        }
        .nav-controls button:hover:not(:disabled) {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .nav-controls button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .nav-controls .page-info {
            flex: 1;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: #0f172a;
        }
        .nav-controls .page-info .total {
            color: #94a3b8;
            font-weight: 400;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .zoom-controls button {
            width: 28px;
            height: 28px;
            border-radius: 5px;
            border: 1px solid #e2e8f0;
            background: white;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            transition: all 0.15s;
        }
        .zoom-controls button:hover {
            background: #f1f5f9;
        }
        .zoom-controls .zoom-level {
            flex: 1;
            text-align: center;
            font-size: 12px;
            color: #475569;
            font-weight: 500;
        }

        .audio-player {
            background: #f8fafc;
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid #eef0f4;
        }
        .audio-player .audio-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .audio-player .audio-header .label {
            font-size: 9px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .audio-player .audio-header .status-text {
            font-size: 11px;
            color: #64748b;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0 8px;
        }
        .progress-container .time {
            font-size: 10px;
            color: #94a3b8;
            font-variant-numeric: tabular-nums;
            min-width: 32px;
        }
        .progress-container .time.current {
            color: #0f172a;
        }
        .progress-bar {
            flex: 1;
            height: 3px;
            border-radius: 2px;
            background: #e2e8f0;
            cursor: pointer;
            position: relative;
            transition: height 0.15s;
        }
        .progress-bar:hover {
            height: 5px;
        }
        .progress-bar .progress-fill {
            height: 100%;
            border-radius: 2px;
            background: #3b82f6;
            width: 0%;
            transition: width 0.1s;
            position: relative;
        }

        .audio-controls-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .audio-controls-row button {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: #f1f5f9;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            transition: all 0.15s;
        }
        .audio-controls-row button:hover {
            background: #e2e8f0;
        }
        .audio-controls-row button.playing {
            background: #3b82f6;
            color: white;
        }
        .audio-controls-row button.playing:hover {
            background: #2563eb;
        }
        .audio-controls-row .audio-name {
            flex: 1;
            font-size: 11px;
            color: #475569;
            margin-left: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .audio-list-section {
            background: #f8fafc;
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid #eef0f4;
            max-height: 160px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .audio-list-section::-webkit-scrollbar {
            width: 3px;
        }
        .audio-list-section::-webkit-scrollbar-thumb {
            background: #d1d9e6;
            border-radius: 4px;
        }
        .audio-list-section .section-title {
            font-size: 9px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .audio-list-section .section-title .count {
            font-weight: 400;
            font-size: 9px;
        }
        .audio-list-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 11px;
            color: #475569;
        }
        .audio-list-item:hover {
            background: #eef2f6;
        }
        .audio-list-item.active {
            background: #eff6ff;
            color: #1e293b;
        }
        .audio-list-item .page-tag {
            background: #e2e8f0;
            padding: 0 5px;
            border-radius: 3px;
            font-size: 8px;
            font-weight: 600;
            color: #64748b;
            flex-shrink: 0;
        }
        .audio-list-item .audio-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .audio-list-item .audio-status-icon {
            font-size: 10px;
            flex-shrink: 0;
        }
        .audio-list-item .replace-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 10px;
            padding: 2px 3px;
            border-radius: 3px;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .audio-list-item .replace-btn:hover {
            background: #e2e8f0;
            color: #3b82f6;
        }
        .audio-list-empty {
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
            padding: 6px 0;
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            padding: 20px 28px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            min-width: 240px;
            text-align: center;
            animation: toastIn 0.3s ease-out;
            pointer-events: none;
        }
        .toast.success {
            background: #dcfce7;
            color: #166534;
            border: 2px solid #86efac;
        }
        .toast.error {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #fca5a5;
        }
        .toast.info {
            background: #dbeafe;
            color: #1e40af;
            border: 2px solid #93c5fd;
        }
        .toast .toast-sub {
            font-size: 12px;
            font-weight: 400;
            margin-top: 4px;
            opacity: 0.8;
        }
        .toast .toast-close {
            position: absolute;
            top: 6px;
            right: 10px;
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: inherit;
            opacity: 0.5;
            pointer-events: auto;
        }
        .toast .toast-close:hover {
            opacity: 1;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        .toast-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: 9998;
            pointer-events: auto;
        }

        .hidden-input {
            display: none;
        }

        .qr-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        .qr-modal-overlay.active {
            display: flex;
        }
        .qr-modal {
            background: white;
            border-radius: 16px;
            padding: 24px 28px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
        }
        .qr-modal h3 {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .qr-modal .desc {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 16px;
        }
        .qr-modal .qr-code-container {
            background: white;
            padding: 16px;
            border-radius: 12px;
            display: inline-block;
            border: 2px solid #eef0f4;
            margin: 8px 0;
        }
        .qr-modal .qr-code-container #qrcode {
            display: inline-block;
        }
        .qr-modal .qr-code-container #qrcode img {
            display: block;
            margin: 0 auto;
        }
        .qr-modal .qr-status {
            font-size: 13px;
            color: #475569;
            margin: 12px 0;
        }
        .qr-modal .qr-status .connected {
            color: #22c55e;
            font-weight: 600;
        }
        .qr-modal .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .qr-modal .btn-row button {
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .qr-modal .btn-row .btn-close {
            background: #f1f5f9;
            color: #475569;
        }
        .qr-modal .btn-row .btn-close:hover {
            background: #e2e8f0;
        }
        .qr-modal .btn-row .btn-refresh {
            background: #3b82f6;
            color: white;
        }
        .qr-modal .btn-row .btn-refresh:hover {
            background: #2563eb;
        }

        .scanner-container {
            display: none;
        }

        @media (max-width: 768px) {
            .app {
                flex-direction: column;
            }
            .top-bar {
                display: flex !important;
            }
            .menu-toggle {
                display: flex !important;
            }
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: 280px;
                height: 100%;
                transform: translateX(-100%);
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
                border-right: none;
                z-index: 100;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-overlay {
                display: block;
            }
            .main-content {
                flex: 1;
                flex-direction: column;
            }
            .pdf-viewport {
                flex: 1;
            }
            .right-toolbar {
                width: 100%;
                min-width: unset;
                height: auto;
                max-height: 50vh;
                border-left: none;
                border-top: 1px solid rgba(226, 232, 240, 0.5);
                padding: 8px 10px;
                overflow-y: auto;
                flex-shrink: 0;
            }
            .right-toolbar .tool-section {
                padding: 6px 8px;
            }
            .right-toolbar .audio-list-section {
                max-height: 80px;
            }
            .right-toolbar .audio-player {
                padding: 6px 8px;
            }
            .right-toolbar .nav-controls button {
                width: 28px;
                height: 28px;
                font-size: 12px;

    <script>
        (function() {
            'use strict';

            const STORAGE_KEY = 'audioPdfRecords';
            const DB_NAME = 'AudioPdfDB';
            const STORE_NAME = 'pdfFiles';
            const AUDIO_STORE_NAME = 'audioFiles';

            const PDFJS = window.pdfjsLib;
            PDFJS.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            let db = null;
            let records = [];
            let currentRecordId = null;
            let pdfDoc = null;
            let currentPage = 1;
            let totalPages = 0;
            let pageAudioMap = new Map();
            let audioElements = {};
            let currentAudio = null;
            let isPlaying = false;
            let zoomLevel = 1.0;
            let baseScale = 1.0;
            let panX = 0,
                panY = 0;
            let isLoading = false;
            let replaceTargetPage = null;

        

            const canvas = document.getElementById('pdfCanvas');
            const ctx = canvas.getContext('2d');
            const canvasWrapper = document.getElementById('canvasWrapper');
            const viewport = document.getElementById('pdfViewport');
            const placeholder = document.getElementById('pdfPlaceholder');
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            const fileDetailDisplay = document.getElementById('fileDetailDisplay');
            const pageInfoDisplay = document.getElementById('pageInfoDisplay');
            const zoomLevelDisplay = document.getElementById('zoomLevelDisplay');
            const recordListEl = document.getElementById('recordList');
            const audioStatusText = document.getElementById('audioStatusText');
            const currentAudioName = document.getElementById('currentAudioName');
            const currentTimeDisplay = document.getElementById('currentTimeDisplay');
            const durationDisplay = document.getElementById('durationDisplay');
            const progressFill = document.getElementById('progressFill');
            const progressBar = document.getElementById('progressBar');
            const audioListContainer = document.getElementById('audioListContainer');
            const audioCountDisplay = document.getElementById('audioCountDisplay');
            const topBarStatus = document.getElementById('topBarStatus');

            const playBtn = document.getElementById('playBtn');
            const stopBtn = document.getElementById('stopBtn');
            const prevPageBtn = document.getElementById('prevPageBtn');
            const nextPageBtn = document.getElementById('nextPageBtn');
            const pdfFileInput = document.getElementById('pdfFileInput');
            const audioFileInput = document.getElementById('audioFileInput');
            const replaceAudioInput = document.getElementById('replaceAudioInput');
            const zipFileInput = document.getElementById('zipFileInput');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const menuToggle = document.getElementById('menuToggle');
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            const zoomOutBtn = document.getElementById('zoomOutBtn');
            const zoomInBtn = document.getElementById('zoomInBtn');
            const zoomResetBtn = document.getElementById('zoomResetBtn');
            const exportAllBtn = document.getElementById('exportAllBtn');
            const importZipBtn = document.getElementById('importZipBtn');

     

   
            const readingTimer = document.getElementById('readingTimer');
            const timerDisplay = document.getElementById('timerDisplay');
            let timerInterval = null;
            let timerSeconds = 0;
            let isTimerRunning = false;
            let timerRecordId = null;

            function formatTimer(seconds) {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = Math.floor(seconds % 60);
                if (h > 0) {
                    return String(h).padStart(2, '0') + ':' +
                        String(m).padStart(2, '0') + ':' +
                        String(s).padStart(2, '0');
                }
                return String(m).padStart(2, '0') + ':' +
                    String(s).padStart(2, '0');
            }

            function saveTimerToRecord(recordId, seconds) {
                const rec = records.find(r => r.id === recordId);
                if (rec) {
                    rec.readingSeconds = seconds;
                    saveRecords();
                }
            }

            function startTimer(recordId) {
                if (isTimerRunning && timerRecordId === recordId) return;
                if (isTimerRunning) {
                    stopTimer();
                }
                timerRecordId = recordId;
                timerSeconds = 0;
                isTimerRunning = true;
                readingTimer.classList.add('active');
                const rec = records.find(r => r.id === recordId);
                if (rec && rec.readingSeconds) {
                    timerSeconds = rec.readingSeconds;
                    timerDisplay.textContent = formatTimer(timerSeconds);
                } else {
                    timerDisplay.textContent = '00:00:00';
                }
                if (timerInterval) {
                    clearInterval(timerInterval);
                }
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    timerDisplay.textContent = formatTimer(timerSeconds);
                    if (timerSeconds % 10 === 0) {
                        saveTimerToRecord(recordId, timerSeconds);
                    }
                }, 1000);
            }

            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                if (isTimerRunning && timerRecordId) {
                    saveTimerToRecord(timerRecordId, timerSeconds);
                }
                isTimerRunning = false;
                readingTimer.classList.remove('active');
                timerRecordId = null;
            }

            function pauseTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                if (isTimerRunning && timerRecordId) {
                    saveTimerToRecord(timerRecordId, timerSeconds);
                }
                isTimerRunning = false;
            }

            function resumeTimer(recordId) {
                if (!recordId || isTimerRunning) return;
                if (timerRecordId === recordId) {
                    isTimerRunning = true;
                    timerInterval = setInterval(() => {
                        timerSeconds++;
                        timerDisplay.textContent = formatTimer(timerSeconds);
                        if (timerSeconds % 10 === 0) {
                            saveTimerToRecord(recordId, timerSeconds);
                        }
                    }, 1000);
                }
            }

            function loadTimerFromRecord(recordId) {
                const rec = records.find(r => r.id === recordId);
                if (rec && rec.readingSeconds && rec.readingSeconds > 0) {
                    timerSeconds = rec.readingSeconds;
                    timerDisplay.textContent = formatTimer(timerSeconds);
                    readingTimer.classList.add('active');
                    isTimerRunning = true;
                    timerRecordId = recordId;
                    if (timerInterval) {
                        clearInterval(timerInterval);
                    }
                    timerInterval = setInterval(() => {
                        timerSeconds++;
                        timerDisplay.textContent = formatTimer(timerSeconds);
                        if (timerSeconds % 10 === 0) {
                            saveTimerToRecord(recordId, timerSeconds);
                        }
                    }, 1000);
                } else {
                    startTimer(recordId);
                }
            }

            function showToast(message, type, subMessage) {
                const overlay = document.createElement('div');
                overlay.className = 'toast-overlay';
                overlay.id = 'toastOverlay';
                document.body.appendChild(overlay);

                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                toast.id = 'toastMessage';
                toast.innerHTML = `
                        <button class="toast-close" onclick="document.getElementById('toastMessage').remove();document.getElementById('toastOverlay').remove();">✕</button>
                        <div>${message}</div>
                        ${subMessage ? `<div class="toast-sub">${subMessage}</div>` : ''}
                    `;
                document.body.appendChild(toast);

                overlay.addEventListener('click', function() {
                    toast.remove();
                    overlay.remove();
                });

                setTimeout(() => {
                    if (document.getElementById('toastMessage')) {
                        toast.remove();
                        overlay.remove();
                    }
                }, 4000);
            }

            function openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, 2);
                    request.onupgradeneeded = function(e) {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains(AUDIO_STORE_NAME)) {
                            db.createObjectStore(AUDIO_STORE_NAME, { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = function(e) { db = e.target.result;
                        resolve(db); };
                    request.onerror = function(e) { reject(e.target.error); };
                });
            }

            function savePDFToDB(id, data) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction([STORE_NAME], 'readwrite');
                    tx.objectStore(STORE_NAME).put({ id, data }).onsuccess = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }

            function getPDFFromDB(id) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction([STORE_NAME], 'readonly');
                    const req = tx.objectStore(STORE_NAME).get(id);
                    req.onsuccess = () => resolve(req.result ? req.result.data : null);
                    req.onerror = () => reject(req.error);
                });
            }

            function deletePDFFromDB(id) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction([STORE_NAME], 'readwrite');
                    tx.objectStore(STORE_NAME).delete(id).onsuccess = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }

            function saveAudioToDB(id, data, name) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction([AUDIO_STORE_NAME], 'readwrite');
                    tx.objectStore(AUDIO_STORE_NAME).put({ id, data, name }).onsuccess = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }

            function getAudioFromDB(id) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction([AUDIO_STORE_NAME], 'readonly');
                    const req = tx.objectStore(AUDIO_STORE_NAME).get(id);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => reject(req.error);
                });
            }

            function deleteAudioFromDB(id) {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction([AUDIO_STORE_NAME], 'readwrite');
                    tx.objectStore(AUDIO_STORE_NAME).delete(id).onsuccess = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }

            function getAllAudioFromDB() {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction([AUDIO_STORE_NAME], 'readonly');
                    const req = tx.objectStore(AUDIO_STORE_NAME).getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => reject(req.error);
                });
            }

            function clearAllAudioFromDB() {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction([AUDIO_STORE_NAME], 'readwrite');
                    tx.objectStore(AUDIO_STORE_NAME).clear().onsuccess = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }

            function loadRecords() {
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    records = data ? JSON.parse(data) : [];
                } catch (e) { records = []; }
                if (!Array.isArray(records)) records = [];
            }

            function saveRecords() {
                try {
                    const saveData = records.map(r => {
                        const clean = { ...r };
                        if (clean.audioMap) {
                            const newMap = {};
                            for (const [k, v] of Object.entries(clean.audioMap)) {
                                newMap[k] = { name: v.name, audioId: v.audioId };
                            }
                            clean.audioMap = newMap;
                        }
                        delete clean.pdfData;
                        return clean;
                    });
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
                } catch (e) { console.warn('保存失败', e); }
            }


            // ============================================================
            //  导出全部ZIP - 按PDF分文件夹
            // ============================================================

            async function exportAllData() {
                const zip = new JSZip();
                
                for (const rec of records) {
                    // 每个PDF单独一个文件夹，用PDF名称命名
                    const folderName = rec.name.replace(/\.pdf$/i, '').replace(/[\\/:*?"<>|]/g, '_') || '未命名';
                    const folder = zip.folder(folderName);
                    
                    // 导出PDF
                    try {
                        const pdfData = await getPDFFromDB(rec.id);
                        if (pdfData) {
                            folder.file(rec.name || 'document.pdf', pdfData);
                        }
                    } catch(e) { console.warn('导出PDF失败:', rec.id, e); }
                    
                    // 导出音频
                    if (rec.audioMap) {
                        for (const [pageIdx, audioInfo] of Object.entries(rec.audioMap)) {
                            if (audioInfo.audioId) {
                                try {
                                    const audioData = await getAudioFromDB(audioInfo.audioId);
                                    if (audioData && audioData.data) {
                                        const ext = audioData.name ? audioData.name.split('.').pop() : 'mp3';
                                        const audioName = 'page_' + (parseInt(pageIdx) + 1) + '.' + ext;
                                        folder.file(audioName, audioData.data);
                                    }
                                } catch(e) {
                                    console.warn('导出音频失败:', e);
                                }
                            }
                        }
                    }
                }

                const zipBlob = await zip.generateAsync({ type: 'blob' });
                return zipBlob;
            }

            // ============================================================
            //  导出单个绘本
            // ============================================================

            async function exportSingleRecord(recordId) {
                const rec = records.find(r => r.id === recordId);
                if (!rec) { showToast('记录不存在', 'error'); return; }

                try {
                    const zip = new JSZip();
                    const folderName = rec.name.replace(/\.pdf$/i, '').replace(/[\\/:*?"<>|]/g, '_') || '未命名';
                    const folder = zip.folder(folderName);
                    
                    // 导出PDF
                    const pdfData = await getPDFFromDB(rec.id);
                    if (pdfData) {
                        folder.file(rec.name || 'document.pdf', pdfData);
                    }
                    
                    // 导出音频
                    if (rec.audioMap) {
                        for (const [pageIdx, audioInfo] of Object.entries(rec.audioMap)) {
                            if (audioInfo.audioId) {
                                try {
                                    const audioData = await getAudioFromDB(audioInfo.audioId);
                                    if (audioData && audioData.data) {
                                        const ext = audioData.name ? audioData.name.split('.').pop() : 'mp3';
                                        const audioName = 'page_' + (parseInt(pageIdx) + 1) + '.' + ext;
                                        folder.file(audioName, audioData.data);
                                    }
                                } catch(e) {
                                    console.warn('导出音频失败:', e);
                                }
                            }
                        }
                    }

                    const zipBlob = await zip.generateAsync({ type: 'blob' });
                    const link = document.createElement('a');
                    link.download = folderName + '.zip';
                    link.href = URL.createObjectURL(zipBlob);
                    link.click();
                    URL.revokeObjectURL(link.href);
                    showToast('导出成功: ' + rec.name, 'success', (zipBlob.size / 1024 / 1024).toFixed(1) + ' MB');
                } catch (e) {
                    console.error(e);
                    showToast('导出失败: ' + rec.name, 'error', e.message);
                }
            }

            function renderRecords() {
                if (records.length === 0) {
                    recordListEl.innerHTML =
                    `<div class="record-empty">暂无阅读记录<br><span style="font-size:9px;">导入PDF后自动保存</span></div>`;
                    return;
                }
                let html = '';
                records.forEach((rec) => {
                    const active = rec.id === currentRecordId ? 'active' : '';
                    const pages = rec.pages || 0;
                    const audioCount = rec.audioMap ? Object.keys(rec.audioMap).length : 0;
                    html += `
                            <div class="record-item ${active}" data-id="${rec.id}">
                                <div class="info" data-id="${rec.id}">
                                    <div class="name">${rec.name || '未命名'}</div>
                                    <div class="meta">
                                        <span>${pages}页</span>
                                        <span class="badge-pages">音频 ${audioCount}</span>
                                    </div>
                                </div>
                                <div class="item-actions">
                                    <button class="export-btn" data-id="${rec.id}" title="导出此绘本">📤</button>
                                    <button class="delete-btn" data-id="${rec.id}" title="删除">✕</button>
                                </div>
                            </div>
                        `;
                });
                recordListEl.innerHTML = html;

                document.querySelectorAll('.record-item .info').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.dataset.id;
                        if (id) { loadRecord(id);
                            closeSidebar(); }
                    });
                });

                document.querySelectorAll('.record-item .delete-btn').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        if (id && confirm('确定删除此记录吗？')) deleteRecord(id);
                    });
                });

                document.querySelectorAll('.record-item .export-btn').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        if (id) exportSingleRecord(id);
                    });
                });
            }

            async function deleteRecord(id) {
                try {
                    const rec = records.find(r => r.id === id);
                    if (rec && rec.audioMap) {
                        for (const [k, v] of Object.entries(rec.audioMap)) {
                            if (v.audioId) await deleteAudioFromDB(v.audioId);
                        }
                    }
                    await deletePDFFromDB(id);
                    records = records.filter(r => r.id !== id);
                    if (currentRecordId === id) {
                        currentRecordId = null;
                        pdfDoc = null;
                        totalPages = 0;
                        currentPage = 1;
                        pageAudioMap.clear();
                        audioElements = {};
                        placeholder.style.display = 'block';
                        canvas.style.display = 'none';
                        updateUI();
                        audioStatusText.textContent = '就绪';
                        topBarStatus.textContent = '就绪';
                        stopTimer();
                    }
                    saveRecords();
                    renderRecords();
                    renderAudioList();
                    showToast('已删除记录', 'info');
                } catch (e) { console.error('删除失败:', e);
                    showToast('删除失败', 'error', e.message); }
            }

            async function clearAllRecords() {
                if (!confirm('确定删除所有记录吗？此操作不可恢复！')) return;
                try {
                    for (const rec of records) {
                        if (rec.audioMap) {
                            for (const [k, v] of Object.entries(rec.audioMap)) {
                                if (v.audioId) await deleteAudioFromDB(v.audioId);
                            }
                        }
                        await deletePDFFromDB(rec.id);
                    }
                    records = [];
                    currentRecordId = null;
                    pdfDoc = null;
                    totalPages = 0;
                    currentPage = 1;
                    pageAudioMap.clear();
                    audioElements = {};
                    placeholder.style.display = 'block';
                    canvas.style.display = 'none';
                    updateUI();
                    saveRecords();
                    renderRecords();
                    renderAudioList();
                    audioStatusText.textContent = '已清空';
                    topBarStatus.textContent = '已清空';
                    stopTimer();
                    showToast('已清空所有记录', 'info');
                } catch (e) { console.error('清空失败:', e);
                    showToast('清空失败', 'error', e.message); }
            }

            const pageCache = new Map();
            let isRendering = false;
            let pendingPage = null;

// ============================================================
//  缩放计算 - 根据PDF实际容器高度计算
// ============================================================

let fitScale = 1.0;

function calculateFitScale(pageWidth, pageHeight) {
    // ✅ 直接使用 PDF 容器的实际尺寸
    const rect = viewport.getBoundingClientRect();
    
    // 容器的实际宽高（已经减去了顶部栏、右侧栏等）
    const containerWidth = rect.width;
    const containerHeight = rect.height;
    
    // 边距（让页面不贴边）
    const padding = 20;
    
    const availableWidth = containerWidth - padding * 2;
    const availableHeight = containerHeight - padding * 2;
    
    // 计算缩放
    const scaleX = availableWidth / pageWidth;
    const scaleY = availableHeight / pageHeight;
    fitScale = Math.min(scaleX, scaleY);
    
    // 限制范围
    if (fitScale < 0.2) fitScale = 0.2;
    if (fitScale > 2.0) fitScale = 2.0;
    return fitScale;
}
            // ============================================================
            //  renderPage - 支持无限缩放
            // ============================================================

            function renderPage(num) {
                if (!pdfDoc) {
                    placeholder.style.display = 'block';
                    canvas.style.display = 'none';
                    return;
                }

                if (isRendering) {
                    pendingPage = num;
                    return;
                }

                isRendering = true;

                const cacheKey = num + '_' + zoomLevel.toFixed(4);
                if (pageCache.has(cacheKey)) {
                    const cached = pageCache.get(cacheKey);
                    canvas.width = cached.width;
                    canvas.height = cached.height;
                    ctx.drawImage(cached.canvas, 0, 0);
                    canvas.style.display = 'block';
                    placeholder.style.display = 'none';
                    updateTransform();
                    renderAudioList();
                    setTimeout(() => autoPlay(), 300);
                    isRendering = false;
                    if (pendingPage !== null) {
                        const nextPage = pendingPage;
                        pendingPage = null;
                        renderPage(nextPage);
                    }
                    return;
                }

                if (currentRenderTask) {
                    currentRenderTask.cancel();
                    currentRenderTask = null;
                }

                pdfDoc.getPage(num).then(page => {
                    const vp = page.getViewport({ scale: 1 });
                    const fitScaleValue = calculateFitScale(vp.width, vp.height);
                    // 最终缩放 = 占满比例 × 用户缩放倍数（无上限）
                    const totalScale = fitScaleValue * zoomLevel;
                    const svp = page.getViewport({ scale: totalScale });

                    const offscreen = document.createElement('canvas');
                    offscreen.width = svp.width;
                    offscreen.height = svp.height;
                    const offCtx = offscreen.getContext('2d');

                    const renderTask = page.render({
                        canvasContext: offCtx,
                        viewport: svp,
                        background: 'white'
                    });
                    currentRenderTask = renderTask;
                    return renderTask.promise.then(() => {
                        pageCache.set(cacheKey, {
                            canvas: offscreen,
                            width: svp.width,
                            height: svp.height,
                            scale: zoomLevel
                        });

                        if (pageCache.size > 30) {
                            const firstKey = pageCache.keys().next().value;
                            pageCache.delete(firstKey);
                        }

                        canvas.width = svp.width;
                        canvas.height = svp.height;
                        ctx.drawImage(offscreen, 0, 0);
                        canvas.style.display = 'block';
                        placeholder.style.display = 'none';
                        updateTransform();
                        renderAudioList();
                        setTimeout(() => autoPlay(), 300);

                        preloadAdjacentPages(num);

                        currentRenderTask = null;
                        isRendering = false;

                        if (pendingPage !== null) {
                            const nextPage = pendingPage;
                            pendingPage = null;
                            renderPage(nextPage);
                        }
                    });
                }).catch(err => {
                    if (err.name !== 'RenderingCancelledException') {
                        console.warn('渲染警告:', err);
                    }
                    currentRenderTask = null;
                    isRendering = false;
                    if (pendingPage !== null) {
                        const nextPage = pendingPage;
                        pendingPage = null;
                        renderPage(nextPage);
                    }
                });
            }

            function preloadAdjacentPages(num) {
                if (preloadTimer) {
                    clearTimeout(preloadTimer);
                    preloadTimer = null;
                }

                const pagesToPreload = [];
                for (let i = -2; i <= 2; i++) {
                    if (i === 0) continue;
                    const pageNum = num + i;
                    if (pageNum < 1 || pageNum > totalPages) continue;
                    pagesToPreload.push(pageNum);
                }

                preloadTimer = setTimeout(() => {
                    pagesToPreload.forEach(pageNum => {
                        const cacheKey = pageNum + '_' + zoomLevel.toFixed(4);
                        if (pageCache.has(cacheKey)) return;

                        if (!pdfDoc) return;
                        pdfDoc.getPage(pageNum).then(page => {
                            const vp = page.getViewport({ scale: 1 });
                            const fitScaleValue = calculateFitScale(vp.width, vp.height);
                            const totalScale = fitScaleValue * zoomLevel;
                            const svp = page.getViewport({ scale: totalScale });
                            const offscreen = document.createElement('canvas');
                            offscreen.width = svp.width;
                            offscreen.height = svp.height;
                            const offCtx = offscreen.getContext('2d');
                            return page.render({ canvasContext: offCtx, viewport: svp })
                                .promise.then(() => {
                                    pageCache.set(cacheKey, {
                                        canvas: offscreen,
                                        width: svp.width,
                                        height: svp.height,
                                        scale: zoomLevel
                                    });
                                });
                        }).catch(() => {});
                    });
                }, 200);
            }

           function handleZoomChange(newZoom) {
    const oldZoom = zoomLevel;
    // ✅ 只有下限0.1，没有上限
    zoomLevel = Math.max(0.1, newZoom);
    if (Math.abs(zoomLevel - oldZoom) > 0.001) {
        pageCache.clear();
        zoomLevelDisplay.textContent = Math.round(zoomLevel * 100) + '%';
        if (pdfDoc) {
            renderPage(currentPage);
        } else {
            updateTransform();
        }
    }
}

                zoomLevel = 1.0;
                panX = 0;

                if (pdfDoc) {
                    renderPage(currentPage);

                    updateTransform();

                zoomLevelDisplay.textContent = '100%';

                canvasWrapper.style.transform = `translate(${panX}px, ${panY}px)`;

  function setupPanZoom() {
    // ========================================
    // 滚轮缩放 - 直接操作canvas transform
    // ========================================
    const canvas = document.getElementById('pdfCanvas');
    const wrapper = document.getElementById('canvasWrapper');
    const display = document.getElementById('zoomLevelDisplay');
    
    // 移除canvas尺寸限制
    if (canvas) {
        canvas.style.maxWidth = 'none';
        canvas.style.maxHeight = 'none';
    }
    
    // 存储缩放因子
    let scaleFactor = 1.0;
    
    // 滚轮缩放 - 无上限
    viewport.addEventListener('wheel', function(e) {
        e.preventDefault();
        e.stopPropagation();
        
        const delta = e.deltaY > 0 ? -0.15 : 0.15;
        scaleFactor = Math.max(0.1, scaleFactor + delta);
        
        // 应用缩放 - 直接操作canvas
        if (canvas) {
            canvas.style.transform = 'scale(' + scaleFactor + ')';
            canvas.style.transformOrigin = 'center center';
        }
        
        display.textContent = Math.round(scaleFactor * 100) + '%';
        
        // 同步更新zoomLevel变量（供其他功能使用）
        if (typeof zoomLevel !== 'undefined') {
            zoomLevel = scaleFactor;
        }
        window.__zoomLevel = scaleFactor;
        
    }, { passive: false });

    // ========================================
    // 鼠标拖拽平移
    // ========================================
    let isPanning = false, startX, startY, startPanX, startPanY;
    
    viewport.addEventListener('mousedown', function(e) {
        if (e.button !== 0 || !pdfDoc) return;
        // 如果点击的是canvas，允许拖拽
        if (e.target === canvas || e.target.closest('#pdfCanvas')) {
            isPanning = true;
            startX = e.clientX;
            startY = e.clientY;
            // 获取当前transform
            const transform = canvas.style.transform;
            const match = transform.match(/scale\(([^)]+)\)/);
            if (match) {
                scaleFactor = parseFloat(match[1]) || 1.0;
            }
            // 获取当前偏移
            const wrapperTransform = wrapper.style.transform;
            const translateMatch = wrapperTransform.match(/translate\(([^,]+)px,\s*([^)]+)px\)/);
            if (translateMatch) {
                startPanX = parseFloat(translateMatch[1]) || 0;
                startPanY = parseFloat(translateMatch[2]) || 0;
            } else {
                startPanX = 0;
                startPanY = 0;
            }
            viewport.style.cursor = 'grabbing';
        }
    });
    
    window.addEventListener('mousemove', function(e) {
        if (!isPanning) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        wrapper.style.transform = `translate(${startPanX + dx}px, ${startPanY + dy}px)`;
        // 同步panX, panY
        if (typeof panX !== 'undefined') panX = startPanX + dx;
        if (typeof panY !== 'undefined') panY = startPanY + dy;
    });
    
    window.addEventListener('mouseup', function() {
        if (isPanning) {
            isPanning = false;
            viewport.style.cursor = 'default';
        }
    });

    // ========================================
    // 触摸支持（手机端）
    // ========================================
    let touchStartX, touchStartY, touchStartPanX, touchStartPanY, lastTouchDist = 0, isTouching = false;
    let lastTouchZoom = 1.0;
    
    viewport.addEventListener('touchstart', function(e) {
        if (!pdfDoc) return;
        const t = e.touches;
        if (t.length === 1) {
            isTouching = true;
            touchStartX = t[0].clientX;
            touchStartY = t[0].clientY;
            const wrapperTransform = wrapper.style.transform;
            const translateMatch = wrapperTransform.match(/translate\(([^,]+)px,\s*([^)]+)px\)/);
            if (translateMatch) {
                touchStartPanX = parseFloat(translateMatch[1]) || 0;
                touchStartPanY = parseFloat(translateMatch[2]) || 0;
            } else {
                touchStartPanX = 0;
                touchStartPanY = 0;
            }
        } else if (t.length === 2) {
            const dx = t[0].clientX - t[1].clientX;
            const dy = t[0].clientY - t[1].clientY;
            lastTouchDist = Math.sqrt(dx * dx + dy * dy);
            lastTouchZoom = scaleFactor;
        }
    }, { passive: true });
    
    viewport.addEventListener('touchmove', function(e) {
        if (!pdfDoc) return;
        const t = e.touches;
        if (t.length === 1 && isTouching) {
            const dx = t[0].clientX - touchStartX;
            const dy = t[0].clientY - touchStartY;
            wrapper.style.transform = `translate(${touchStartPanX + dx}px, ${touchStartPanY + dy}px)`;
        } else if (t.length === 2) {
            const dx = t[0].clientX - t[1].clientX;
            const dy = t[0].clientY - t[1].clientY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const scale = dist / lastTouchDist;
            scaleFactor = Math.max(0.1, lastTouchZoom * scale);
            if (canvas) {
                canvas.style.transform = 'scale(' + scaleFactor + ')';
                canvas.style.transformOrigin = 'center center';
            }
            display.textContent = Math.round(scaleFactor * 100) + '%';
            if (typeof zoomLevel !== 'undefined') {
                zoomLevel = scaleFactor;
            }
            window.__zoomLevel = scaleFactor;
        }
    }, { passive: true });
    
    viewport.addEventListener('touchend', function() {
        isTouching = false;
    }, { passive: true });

    // ========================================
    // 窗口resize
    // ========================================
  window.addEventListener('resize', function() {
    if (window.innerWidth <= 768) {
        menuToggle.style.display = 'flex';
    } else {
        menuToggle.style.display = 'none';
        closeSidebar();
    }
    if (pdfDoc) {
        pageCache.clear();
        // ✅ 重新计算 fitScale
        fitScale = 1.0;
        renderPage(currentPage);
    }
});
    console.log('✅ 滚轮缩放已启用（无上限）');
}  



async function addAudios(files) {
                if (!pdfDoc) { showToast('请先导入PDF', 'error'); return; }
                const fileArray = Array.from(files);
                let added = 0;
                for (let i = 0; i < fileArray.length; i++) {
                    const file = fileArray[i];
                    const pageIndex = i;
                    if (pageIndex >= totalPages) { showToast('超过页数(' + totalPages + '页)', 'error'); break; }
                    try {
                        const reader = new FileReader();
                        const arrayBuffer = await new Promise((resolve, reject) => {
                            reader.onload = e => resolve(e.target.result);
                            reader.onerror = e => reject(e.target.error);
                            reader.readAsArrayBuffer(file);
                        });
                        const audioId = 'audio_' + Date.now() + '_' + i;
                        await saveAudioToDB(audioId, arrayBuffer, file.name);
                        if (pageAudioMap.has(pageIndex)) {
                            const old = pageAudioMap.get(pageIndex);
                            if (old.url) URL.revokeObjectURL(old.url);
                            if (old.audioId) await deleteAudioFromDB(old.audioId);
                        }
                        const url = URL.createObjectURL(file);
                        pageAudioMap.set(pageIndex, { name: file.name, url, file, audioId });
                        if (audioElements[pageIndex]) delete audioElements[pageIndex];
                        added++;
                    } catch (e) { console.error('保存音频失败:', e);
                        showToast('音频保存失败', 'error', e.message); }
                }
                updateRecordMetadata(totalPages);
                saveRecords();
                renderRecords();
                renderAudioList();
                showToast('添加了 ' + added + ' 个音频', 'success');
                if (pageAudioMap.has(currentPage - 1)) setTimeout(() => autoPlay(), 300);
            }

            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return m + ':' + s.toString().padStart(2, '0');
            }

            function setupAudioPlayer() {
                progressBar.addEventListener('click', function(e) {
                    if (!currentAudio) return;
                    const rect = this.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width;
                    currentAudio.currentTime = x * (currentAudio.duration || 0);
                });
            }

            function autoPlay() {
                const pageIndex = currentPage - 1;
                const audioData = pageAudioMap.get(pageIndex);
                if (!audioData || !audioData.url) {
                    if (currentAudio) { currentAudio.pause();
                        currentAudio = null;
                        isPlaying = false;
                        updatePlayBtn(); }
                    currentAudioName.textContent = audioData ? '⚠ 文件缺失' : '无音频';
                    currentAudioName.style.color = audioData ? '#ef4444' : '#94a3b8';
                    durationDisplay.textContent = '0:00';
                    currentTimeDisplay.textContent = '0:00';
                    progressFill.style.width = '0%';
                    return;
                }
                currentAudioName.textContent = audioData.name || '音频';
                currentAudioName.style.color = '#475569';

                let audio = audioElements[pageIndex];
                if (!audio) {
                    audio = new Audio(audioData.url);
                    audio.dataset.page = pageIndex;
                    audio.addEventListener('ended', function() {
                        if (currentAudio === this) { currentAudio = null;
                            isPlaying = false;
                            updatePlayBtn(); }
                        progressFill.style.width = '100%';
                        currentTimeDisplay.textContent = durationDisplay.textContent;
                    });
                    audio.addEventListener('timeupdate', function() {
                        if (currentAudio === this) {
                            const current = this.currentTime || 0;
                            const duration = this.duration || 0;
                            currentTimeDisplay.textContent = formatTime(current);
                            durationDisplay.textContent = formatTime(duration);
                            progressFill.style.width = (duration > 0 ? (current / duration * 100) : 0) + '%';
                        }
                    });
                    audio.addEventListener('loadedmetadata', function() {
                        durationDisplay.textContent = formatTime(this.duration);
                    });
                    audio.addEventListener('error', function() { audioStatusText.textContent = '音频加载失败'; });
                    audioElements[pageIndex] = audio;
                }
                if (currentAudio && currentAudio !== audio) currentAudio.pause();
                audio.play().then(() => {
                    currentAudio = audio;
                    isPlaying = true;
                    updatePlayBtn();
                    audioStatusText.textContent = '播放中';
                    durationDisplay.textContent = formatTime(audio.duration);
                }).catch(() => {
                    audioStatusText.textContent = '点击播放';
                    currentAudio = audio;
                    isPlaying = false;
                    updatePlayBtn();
                });
            }

            function togglePlay() {
                const pageIndex = currentPage - 1;
                const audioData = pageAudioMap.get(pageIndex);
                if (!audioData || !audioData.url) { audioStatusText.textContent = '无音频'; return; }
                let audio = audioElements[pageIndex];
                if (!audio) {
                    audio = new Audio(audioData.url);
                    audio.dataset.page = pageIndex;
                    audio.addEventListener('ended', function() {
                        if (currentAudio === this) { currentAudio = null;
                            isPlaying = false;
                            updatePlayBtn(); }
                    });
                    audio.addEventListener('timeupdate', function() {
                        if (currentAudio === this) {
                            const current = this.currentTime || 0;
                            const duration = this.duration || 0;
                            currentTimeDisplay.textContent = formatTime(current);
                            durationDisplay.textContent = formatTime(duration);
                            progressFill.style.width = (duration > 0 ? (current / duration * 100) : 0) + '%';
                        }
                    });
                    audio.addEventListener('loadedmetadata', function() {
                        durationDisplay.textContent = formatTime(this.duration);
                    });
                    audio.addEventListener('error', function() { audioStatusText.textContent = '音频错误'; });
                    audioElements[pageIndex] = audio;
                }
                if (currentAudio && currentAudio !== audio) currentAudio.pause();
                if (audio.paused) {
                    audio.play().then(() => {
                        currentAudio = audio;
                        isPlaying = true;
                        updatePlayBtn();
                        audioStatusText.textContent = '播放中';
                        durationDisplay.textContent = formatTime(audio.duration);

currentPage = 1;

                                        const url = URL.createObjectURL(blob);
                                        pageAudioMap.set(pageIdx, {
                                            name: audioData.name || v.name,
                                            url: url,
                                            file: null,
                                            audioId: v.audioId
                                        });
                                    } else {
                                        pageAudioMap.set(pageIdx, { name: v.name, url: null, file: null,
                                            audioId: v.audioId });

                                    pageAudioMap.set(pageIdx, { name: v.name, url: null, file: null, audioId: v

                            }
                        }

                        placeholder.style.display = 'none';
