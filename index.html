<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>有声PDF阅读器 · 绘本版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
    </script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            -webkit-user-select: none;
            user-select: none;
        }

        .app {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #f0f2f5;
        }

        .sidebar {
            width: 260px;
            min-width: 260px;
            height: 100%;
            background: #ffffff;
            border-right: 1px solid #e4e7ec;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
            transition: transform 0.3s;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 12px 16px 8px;
            border-bottom: 1px solid #eef0f4;
            flex-shrink: 0;
        }
        .sidebar-header h2 {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
        }
        .sidebar-header .sub {
            font-size: 9px;
            color: #94a3b8;
            margin-top: 1px;
        }
        .sidebar-actions {
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex-shrink: 0;
            border-bottom: 1px solid #eef0f4;
        }

        .btn-side {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 6px 8px;
            border-radius: 6px;
            border: none;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            background: #f1f5f9;
            color: #1e293b;
            width: 100%;
            position: relative;
        }
        .btn-side:hover {
            background: #e2e8f0;
        }
        .btn-side:active {
            transform: scale(0.97);
        }
        .btn-side:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-side input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            cursor: pointer;
        }
        .btn-side.danger {
            background: #f1f5f9;
            color: #dc2626;
        }
        .btn-side.danger:hover {
            background: #fee2e2;
        }

        .btn-side .badge {
            background: #ef4444;
            color: white;
            font-size: 8px;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-left: 2px;
        }

        .sidebar-divider {
            border: none;
            border-top: 1px solid #eef0f4;
            margin: 3px 0;
        }

        .record-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px;
            -webkit-overflow-scrolling: touch;
        }
        .record-list::-webkit-scrollbar {
            width: 3px;
        }
        .record-list::-webkit-scrollbar-thumb {
            background: #d1d9e6;
            border-radius: 4px;
        }

        .record-item {
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 3px;
            cursor: pointer;
            transition: all 0.15s;
            background: transparent;
            border: 1px solid transparent;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .record-item:hover {
            background: #f8fafc;
        }
        .record-item.active {
            background: #eff6ff;
            border-color: #bfdbfe;
        }
        .record-item .info {
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }
        .record-item .name {
            font-weight: 600;
            font-size: 11px;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .record-item .meta {
            font-size: 9px;
            color: #94a3b8;
            margin-top: 1px;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .record-item .badge-pages {
            background: #e2e8f0;
            padding: 0 5px;
            border-radius: 6px;
            font-size: 8px;
        }
        .record-item .item-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }
        .record-item .item-actions button {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 11px;
            padding: 2px 4px;
            border-radius: 4px;
            transition: all 0.15s;
        }
        .record-item .item-actions button:hover {
            background: #eef2f6;
            color: #3b82f6;
        }
        .record-item .item-actions .delete-btn:hover {
            background: #fee2e2;
            color: #dc2626;
        }
        .record-item .item-actions .export-btn:hover {
            background: #dcfce7;
            color: #16a34a;
        }
        .record-empty {
            text-align: center;
            color: #94a3b8;
            padding: 20px 12px;
            font-size: 11px;
        }

        .top-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: #ffffff;
            border-bottom: 1px solid #e4e7ec;
            flex-shrink: 0;
            z-index: 10;
            min-height: 44px;
        }
        .top-bar .brand {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
            white-space: nowrap;
        }
        .top-bar .brand-sub {
            font-size: 9px;
            color: #94a3b8;
            margin-left: 4px;
            font-weight: 400;
        }
        .top-bar .menu-toggle {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            color: #1e293b;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .top-bar .menu-toggle:hover {
            background: #f1f5f9;
            border-radius: 6px;
        }
        .top-bar .status {
            font-size: 10px;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 99;
        }
        .sidebar-overlay.active {
            display: block;
        }

        .main-content {
            flex: 1;
            display: flex;
            height: 100%;
            overflow: hidden;
            background: #e8ecf1;
            position: relative;
        }

        .pdf-viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #e8ecf1;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pdf-viewport .canvas-wrapper {
            position: relative;
            display: flex;
            align-items: flex-start;  
            justify-content: center;
            touch-action: none;
            cursor: grab;
            width: 100%;
            height: 100%;
        }
        .pdf-viewport .canvas-wrapper:active {
            cursor: grabbing;
        }
        #pdfCanvas {
            display: none;
            background: white;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            touch-action: none;
            max-width: 100%;
            max-height: 100%;
        }
        .pdf-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #94a3b8;
            font-size: 15px;
            text-align: center;
            pointer-events: none;
        }
        .pdf-placeholder .big-icon {
            font-size: 36px;
            display: block;
            margin-bottom: 8px;
        }

        .right-toolbar {
            width: 280px;
            min-width: 280px;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-left: 1px solid rgba(226, 232, 240, 0.5);
            display: flex;
            flex-direction: column;
            padding: 12px 14px 16px;
            z-index: 15;
            flex-shrink: 0;
            overflow-y: auto;
            gap: 6px;
        }
        .right-toolbar::-webkit-scrollbar {
            width: 3px;
        }
        .right-toolbar::-webkit-scrollbar-thumb {
            background: #d1d9e6;
            border-radius: 4px;
        }

        .tool-section {
            background: #f8fafc;
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid #eef0f4;
        }
        .tool-section .section-title {
            font-size: 9px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .file-info .name {
            font-weight: 600;
            font-size: 13px;
            color: #0f172a;
            word-break: break-all;
            line-height: 1.3;
        }
        .file-info .detail {
            font-size: 11px;
            color: #94a3b8;
        }
        .reading-timer {
            display: none;
            margin-top: 6px;
            padding: 4px 10px;
            background: #eff6ff;
            border-radius: 6px;
            font-size: 12px;
            color: #1e40af;
            align-items: center;
            gap: 6px;
            border: 1px solid #bfdbfe;
        }
        .reading-timer.active {
            display: flex !important;
        }
        .reading-timer .timer-value {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            min-width: 70px;
        }
        .reading-timer .timer-label {
            font-size: 10px;
            color: #64748b;
            margin-left: auto;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-controls button {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            background: white;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            transition: all 0.15s;
        }
        .nav-controls button:hover:not(:disabled) {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .nav-controls button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .nav-controls .page-info {
            flex: 1;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: #0f172a;
        }
        .nav-controls .page-info .total {
            color: #94a3b8;
            font-weight: 400;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .zoom-controls button {
            width: 28px;
            height: 28px;
            border-radius: 5px;
            border: 1px solid #e2e8f0;
            background: white;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            transition: all 0.15s;
        }
        .zoom-controls button:hover {
            background: #f1f5f9;
        }
        .zoom-controls .zoom-level {
            flex: 1;
            text-align: center;
            font-size: 12px;
            color: #475569;
            font-weight: 500;
        }

        .audio-player {
            background: #f8fafc;
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid #eef0f4;
        }
        .audio-player .audio-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .audio-player .audio-header .label {
            font-size: 9px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .audio-player .audio-header .status-text {
            font-size: 11px;
            color: #64748b;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0 8px;
        }
        .progress-container .time {
            font-size: 10px;
            color: #94a3b8;
            font-variant-numeric: tabular-nums;
            min-width: 32px;
        }
        .progress-container .time.current {
            color: #0f172a;
        }
        .progress-bar {
            flex: 1;
            height: 3px;
            border-radius: 2px;
            background: #e2e8f0;
            cursor: pointer;
            position: relative;
            transition: height 0.15s;
        }
        .progress-bar:hover {
            height: 5px;
        }
        .progress-bar .progress-fill {
            height: 100%;
            border-radius: 2px;
            background: #3b82f6;
            width: 0%;
            transition: width 0.1s;
            position: relative;
        }

        .audio-controls-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .audio-controls-row button {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: #f1f5f9;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            transition: all 0.15s;
        }
        .audio-controls-row button:hover {
            background: #e2e8f0;
        }
        .audio-controls-row button.playing {
            background: #3b82f6;
            color: white;
        }
        .audio-controls-row button.playing:hover {
            background: #2563eb;
        }
        .audio-controls-row .audio-name {
            flex: 1;
            font-size: 11px;
            color: #475569;
            margin-left: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .audio-list-section {
            background: #f8fafc;
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid #eef0f4;
            max-height: 160px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .audio-list-section::-webkit-scrollbar {
            width: 3px;
        }
        .audio-list-section::-webkit-scrollbar-thumb {
            background: #d1d9e6;
            border-radius: 4px;
        }
        .audio-list-section .section-title {
            font-size: 9px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .audio-list-section .section-title .count {
            font-weight: 400;
            font-size: 9px;
        }
        .audio-list-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 11px;
            color: #475569;
        }
        .audio-list-item:hover {
            background: #eef2f6;
        }
        .audio-list-item.active {
            background: #eff6ff;
            color: #1e293b;
        }
        .audio-list-item .page-tag {
            background: #e2e8f0;
            padding: 0 5px;
            border-radius: 3px;
            font-size: 8px;
            font-weight: 600;
            color: #64748b;
            flex-shrink: 0;
        }
        .audio-list-item .audio-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .audio-list-item .audio-status-icon {
            font-size: 10px;
            flex-shrink: 0;
        }
        .audio-list-item .replace-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 10px;
            padding: 2px 3px;
            border-radius: 3px;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .audio-list-item .replace-btn:hover {
            background: #e2e8f0;
            color: #3b82f6;
        }
        .audio-list-empty {
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
            padding: 6px 0;
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            padding: 20px 28px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            min-width: 240px;
            text-align: center;
            animation: toastIn 0.3s ease-out;
            pointer-events: none;
        }
        .toast.success {
            background: #dcfce7;
            color: #166534;
            border: 2px solid #86efac;
        }
        .toast.error {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #fca5a5;
        }
        .toast.info {
            background: #dbeafe;
            color: #1e40af;
            border: 2px solid #93c5fd;
        }
        .toast .toast-sub {
            font-size: 12px;
            font-weight: 400;
            margin-top: 4px;
            opacity: 0.8;
        }
        .toast .toast-close {
            position: absolute;
            top: 6px;
            right: 10px;
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: inherit;
            opacity: 0.5;
            pointer-events: auto;
        }
        .toast .toast-close:hover {
            opacity: 1;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        .toast-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: 9998;
            pointer-events: auto;
        }

        .hidden-input {
            display: none;
        }

        .qr-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        .qr-modal-overlay.active {
            display: flex;
        }
        .qr-modal {
            background: white;
            border-radius: 16px;
            padding: 24px 28px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
        }
        .qr-modal h3 {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .qr-modal .desc {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 16px;
        }
        .qr-modal .qr-code-container {
            background: white;
            padding: 16px;
            border-radius: 12px;
            display: inline-block;
            border: 2px solid #eef0f4;
            margin: 8px 0;
        }
        .qr-modal .qr-code-container #qrcode {
            display: inline-block;
        }
        .qr-modal .qr-code-container #qrcode img {
            display: block;
            margin: 0 auto;
        }
        .qr-modal .qr-status {
            font-size: 13px;
            color: #475569;
            margin: 12px 0;
        }
        .qr-modal .qr-status .connected {
            color: #22c55e;
            font-weight: 600;
        }
        .qr-modal .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .qr-modal .btn-row button {
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .qr-modal .btn-row .btn-close {
            background: #f1f5f9;
            color: #475569;
        }
        .qr-modal .btn-row .btn-close:hover {
            background: #e2e8f0;
        }
        .qr-modal .btn-row .btn-refresh {
            background: #3b82f6;
            color: white;
        }
        .qr-modal .btn-row .btn-refresh:hover {
            background: #2563eb;
        }

        .scanner-container {
            display: none;
        }

        @media (max-width: 768px) {
            .app {
                flex-direction: column;
            }
            .top-bar {
                display: flex !important;
            }
            .menu-toggle {
                display: flex !important;
            }
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: 280px;
                height: 100%;
                transform: translateX(-100%);
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
                border-right: none;
                z-index: 100;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-overlay {
                display: block;
            }
            .main-content {
                flex: 1;
                flex-direction: column;
            }
            .pdf-viewport {
                flex: 1;
            }
            .right-toolbar {
                width: 100%;
                min-width: unset;
                height: auto;
                max-height: 50vh;
                border-left: none;
                border-top: 1px solid rgba(226, 232, 240, 0.5);
                padding: 8px 10px;
                overflow-y: auto;
                flex-shrink: 0;
            }
            .right-toolbar .tool-section {
                padding: 6px 8px;
            }
            .right-toolbar .audio-list-section {
                max-height: 80px;
            }
            .right-toolbar .audio-player {
                padding: 6px 8px;
            }
            .right-toolbar .nav-controls button {
                width: 28px;
                height: 28px;
